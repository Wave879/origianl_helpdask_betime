<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ข้อเสนอแนะ — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-chat-square-text"></i> ข้อเสนอแนะ</h2></div>

    <div class="bt-card">
      <div class="bt-section-header"><h2>ส่งความคิดเห็นถึงทีมพัฒนา</h2></div>
      <div class="bt-form-group">
        <label class="bt-label">หัวข้อ</label>
        <input id="fb-subject" class="bt-input" placeholder="เช่น ปรับปรุงหน้ารายงาน" />
      </div>
      <div class="bt-form-group">
        <label class="bt-label">ประเภท</label>
        <select id="fb-type" class="bt-select">
          <option value="suggestion">ข้อเสนอแนะ</option>
          <option value="bug">แจ้งปัญหา</option>
          <option value="ui">ปรับปรุงหน้าจอ</option>
        </select>
      </div>
      <div class="bt-form-group">
        <label class="bt-label">รายละเอียด</label>
        <textarea id="fb-message" class="bt-textarea" placeholder="อธิบายสิ่งที่ต้องการให้ปรับปรุง"></textarea>
      </div>
      <button class="bt-btn bt-btn-primary" onclick="submitFeedback()"><i class="bi bi-send"></i> ส่งข้อเสนอแนะ</button>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('feedback.html', 'Feedback');

  const token = () => localStorage.getItem('bt_token');
  const apiReq = (path, opts={}) => fetch('/api'+path, {
    headers: {'Authorization':'Bearer '+token(), 'Content-Type':'application/json'}, ...opts
  });

  async function submitFeedback() {
    const subject = document.getElementById('fb-subject').value.trim();
    const message = document.getElementById('fb-message').value.trim();
    const category = document.getElementById('fb-type').value;
    if (!subject || !message) {
      BT.notify('กรุณากรอกหัวข้อและรายละเอียด', 'warning');
      return;
    }
    try {
      const res = await apiReq('/feedback', {
        method: 'POST',
        body: JSON.stringify({ subject, message, category })
      });
      const d = await res.json();
      if (!d.ok) throw new Error(d.error);
      BT.notify('ส่งข้อเสนอแนะเรียบร้อยแล้ว', 'success');
      document.getElementById('fb-subject').value = '';
      document.getElementById('fb-message').value = '';
    } catch(e) {
      BT.notify('เกิดข้อผิดพลาด: ' + e.message, 'danger');
    }
  }
</script>
</body>
</html>
