<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BA Dashboard — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
  <style>
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:900px){ .two-col{grid-template-columns:1fr;} }
    .ba-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--bt-border); font-size:0.88rem; }
    .ba-row:last-child { border-bottom:none; }
    .ba-badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:0.72rem; font-weight:700; }
    .ba-badge.draft    { background:#f8fafc; color:#475569; border:1px solid #cbd5e1; }
    .ba-badge.review   { background:#fef9c3; color:#854d0e; border:1px solid #fde68a; }
    .ba-badge.approved { background:#f0fdf4; color:#15803d; border:1px solid #bbf7d0; }
    .ba-badge.pending  { background:#f0f9ff; color:#0369a1; border:1px solid #bae6fd; }
  </style>
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header">
      <h2><i class="bi bi-diagram-3"></i> BA Dashboard</h2>
      <button class="bt-btn bt-btn-primary bt-btn-sm" onclick="BT.notify('ฟีเจอร์นี้กำลังพัฒนา','info')"><i class="bi bi-plus-lg"></i> สร้าง Requirement</button>
    </div>

    <!-- KPI -->
    <div class="bt-kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:20px">
      <div class="bt-card"><div class="bt-card-title">Requirement ทั้งหมด</div><div class="bt-card-value" id="kpi-total" style="color:var(--bt-primary)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">รอ Approve</div><div class="bt-card-value" id="kpi-pending" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">Pending</div></div>
      <div class="bt-card"><div class="bt-card-title">อนุมัติแล้ว</div><div class="bt-card-value" id="kpi-approved" style="color:var(--bt-success)">—</div><div class="bt-card-sub">Approved</div></div>
      <div class="bt-card"><div class="bt-card-title">Meeting สัปดาห์นี้</div><div class="bt-card-value" id="kpi-meeting" style="color:#7c3aed">—</div><div class="bt-card-sub">Sessions</div></div>
    </div>

    <div class="two-col">
      <!-- Requirements -->
      <div class="bt-card">
        <div class="bt-section-header"><h2><i class="bi bi-file-text" style="color:var(--bt-primary)"></i> Requirement List</h2></div>
        <div id="req-list"></div>
      </div>
      <!-- Meetings -->
      <div class="bt-card">
        <div class="bt-section-header"><h2><i class="bi bi-calendar3" style="color:var(--bt-accent)"></i> Meeting ล่าสุด</h2></div>
        <div id="meeting-list"></div>
      </div>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
BT.initApp('ba-dashboard.html', 'BA');

const REQUESTS_DATA = [];

const MEETINGS_DATA = [];

const STATUS_LABEL = { draft:'Draft', review:'Review', approved:'Approved', pending:'Pending' };

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('kpi-total').textContent    = REQUESTS_DATA.length;
  document.getElementById('kpi-pending').textContent  = REQUESTS_DATA.filter(x => x.status === 'pending' || x.status === 'review').length;
  document.getElementById('kpi-approved').textContent = REQUESTS_DATA.filter(x => x.status === 'approved').length;
  document.getElementById('kpi-meeting').textContent  = MEETINGS_DATA.length;

  document.getElementById('req-list').innerHTML = REQUESTS_DATA.map(r => `
    <div class="ba-row">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:0.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</div>
        <div style="font-size:0.76rem;color:var(--bt-muted)">${r.owner} · ${r.date}</div>
      </div>
      <span class="ba-badge ${r.status}">${STATUS_LABEL[r.status]}</span>
    </div>`).join('');

  const TYPE_COLOR = { Project:'bt-badge-info', Review:'bt-badge-orange', Planning:'bt-badge-grey', Demo:'bt-badge-success' };
  document.getElementById('meeting-list').innerHTML = MEETINGS_DATA.map(m => `
    <div class="ba-row">
      <i class="bi bi-calendar-event" style="color:var(--bt-primary);flex-shrink:0"></i>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:0.88rem">${m.title}</div>
        <div style="font-size:0.76rem;color:var(--bt-muted)">${m.date}</div>
      </div>
      <span class="bt-badge ${TYPE_COLOR[m.type]||'bt-badge-info'}" style="font-size:0.72rem">${m.type}</span>
    </div>`).join('');
});
</script>
</body>
</html>
