<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Access - Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: 'Sarabun', sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .card {
      width: min(560px, calc(100vw - 32px));
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 50px rgba(15, 23, 42, 0.12);
      padding: 32px;
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.6; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .primary { background: #1565C0; color: #fff; }
    .secondary { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ไม่มีสิทธิ์เข้าถึง</h1>
    <p>บัญชีนี้ถูกตั้งค่าให้เข้าถึงบางส่วนของระบบเท่านั้น หรืออาจยังไม่ได้รับสิทธิ์ให้เข้าโมดูลนี้</p>
    <div class="actions">
      <button class="btn primary" id="logout-btn">ออกจากระบบ</button>
      <a class="btn secondary" href="/login">กลับไปหน้าเข้าสู่ระบบ</a>
    </div>
  </div>
  <script>
    document.getElementById('logout-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('bt_token');
      if (token) {
        try {
          await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
        } catch {}
      }
      localStorage.removeItem('bt_token');
      localStorage.removeItem('bt_role');
      localStorage.removeItem('bt_user');
      window.location.href = BT.url('/login');
    });
  </script>
</body>
</html>
