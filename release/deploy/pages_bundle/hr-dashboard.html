<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR Dashboard — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-people"></i> HR Module Dashboard</h2></div>
    <div class="bt-kpi-grid">
      <div class="bt-card"><div class="bt-card-title">พนักงานทั้งหมด</div><div class="bt-card-value" id="hr-total">—</div><div class="bt-card-sub">คน</div></div>
      <div class="bt-card"><div class="bt-card-title">Active</div><div class="bt-card-value" id="hr-active" style="color:var(--bt-success)">—</div><div class="bt-card-sub">คน</div></div>
      <div class="bt-card"><div class="bt-card-title">แผนก</div><div class="bt-card-value" id="hr-depts" style="color:var(--bt-primary)">—</div><div class="bt-card-sub">แผนก</div></div>
      <div class="bt-card"><div class="bt-card-title">ภาระงานรวม</div><div class="bt-card-value" id="hr-workload" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">งานรวม</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="bt-card">
        <div class="bt-section-header">
          <h2>พนักงานทั้งหมด</h2>
          <a href="/hr.html" class="bt-btn bt-btn-outline bt-btn-sm">จัดการ</a>
        </div>
        <div id="hr-emp-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
      <div class="bt-card">
        <div class="bt-section-header"><h2>ภาระงานทีม</h2></div>
        <div id="hr-workload-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px">
      <a href="/skills.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <div style="font-size:2rem">🎓</div>
        <div style="font-weight:600;margin-top:8px">Skills Matrix</div>
      </a>
      <a href="/certificates.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <div style="font-size:2rem">🏅</div>
        <div style="font-weight:600;margin-top:8px">Certificates</div>
      </a>
      <a href="/workload.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <div style="font-size:2rem">📊</div>
        <div style="font-weight:600;margin-top:8px">Workload View</div>
      </a>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('hr-dashboard.html', 'HR Module');
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const d = await BT.call('dashboard/hr', {}, 'GET');
      document.getElementById('hr-total').textContent    = d.total_users ?? 0;
      document.getElementById('hr-active').textContent   = d.active_users ?? 0;
      document.getElementById('hr-depts').textContent    = d.dept_count ?? 0;
      document.getElementById('hr-workload').textContent = d.total_open_tasks ?? 0;

      const roleColor = { ceo:'red', manager:'orange', staff:'blue', admin:'green' };
      const empRows = (d.users || []).map(u => `<tr>
        <td style="font-size:0.85rem">${u.full_name}</td>
        <td style="font-size:0.82rem;color:#888">${u.department||'-'}</td>
        <td><span class="bt-badge bt-badge-${roleColor[u.role]||'grey'}">${u.role}</span></td>
      </tr>`).join('');
      document.getElementById('hr-emp-list').innerHTML = empRows
        ? `<table class="bt-table"><thead><tr><th>ชื่อ</th><th>แผนก</th><th>Role</th></tr></thead><tbody>${empRows}</tbody></table>`
        : '<p style="color:#888;text-align:center;padding:20px">ไม่มีข้อมูลพนักงาน</p>';

      const wlRows = (d.workload || []).map(w => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
          <div style="flex:1;font-size:0.85rem">${w.full_name}</div>
          <div style="font-size:0.75rem;color:#888">${w.task_count} งาน</div>
          <div style="width:80px;background:#e5e7eb;border-radius:99px;height:6px">
            <div style="width:${Math.min(w.task_count*10,100)}%;background:${w.task_count>5?'var(--bt-danger)':w.task_count>3?'var(--bt-warning)':'var(--bt-success)'};height:6px;border-radius:99px"></div>
          </div>
        </div>`).join('');
      document.getElementById('hr-workload-list').innerHTML = wlRows || '<p style="color:#888;text-align:center;padding:20px">ไม่มีข้อมูลภาระงาน</p>';
    } catch(e) {
      if (e.message === 'Unauthorized') { BT.handleUnauthorized(); return; }
    }
  });
</script>
</body>
</html>
