services:
  betime-postgres:
    image: postgres:16-alpine
    container_name: betime-postgres
    environment:
      POSTGRES_DB: Betime_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5433:5432"
    volumes:
      - betime-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Betime_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  betime-app:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: betime-app
    depends_on:
      betime-postgres:
        condition: service_healthy
    expose:
      - "8788"
    entrypoint: ["/bin/sh", "/app/docker/entrypoint.sh"]
    volumes:
      - ./docker/entrypoint.sh:/app/docker/entrypoint.sh:ro
      - ./wrangler.toml:/app/wrangler.toml:ro
      - ./deploy/pages_bundle:/app/deploy/pages_bundle:ro
    environment:
      PG_URL: postgres://postgres:123456@betime-postgres:5432/Betime_DB
      DATABASE_URL: postgres://postgres:123456@betime-postgres:5432/Betime_DB
      PORT: 8788
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://aidlc-bt.demotoday.net/web}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:-https://ai-team-model-deploy-pr-resource.cognitiveservices.azure.com/}
      AZURE_AI_KEY: ${AZURE_AI_KEY:-}
      AZURE_AI_API_VERSION: ${AZURE_AI_API_VERSION:-2024-12-01-preview}
      AZURE_AI_MODEL: ${AZURE_AI_MODEL:-gpt-4o}
      AZURE_AI_DEPLOYMENT: ${AZURE_AI_DEPLOYMENT:-gpt-4o}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      AZURE_AI_EMBEDDING_DEPLOYMENT: ${AZURE_AI_EMBEDDING_DEPLOYMENT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      AZURE_AD_REDIRECT_URI: ${AZURE_AD_REDIRECT_URI:-}
      KANBAN_SYNC_TOKEN: ${KANBAN_SYNC_TOKEN:-local-betime-kanban-sync}
      EMBEDDING_BACKFILL_TOKEN: ${EMBEDDING_BACKFILL_TOKEN:-local-betime-embedding-backfill}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const options={hostname:'localhost',port:8788,path:'/web/api/health',method:'GET'};const req=http.request(options,(res)=>{process.exit(res.statusCode===200?0:1)});req.on('error',()=>process.exit(1));req.end()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  betime-kanban-sync:
    image: node:20-bookworm-slim
    container_name: betime-kanban-sync
    depends_on:
      betime-app:
        condition: service_healthy
    command: ["/bin/sh", "/app/docker/kanban-sync.sh"]
    volumes:
      - ./docker/kanban-sync.sh:/app/docker/kanban-sync.sh:ro
    environment:
      KANBAN_SYNC_TOKEN: ${KANBAN_SYNC_TOKEN:-local-betime-kanban-sync}
      KANBAN_SYNC_INTERVAL_SECONDS: ${KANBAN_SYNC_INTERVAL_SECONDS:-300}
    restart: unless-stopped

  betime-embedding-backfill:
    image: node:20-bookworm-slim
    container_name: betime-embedding-backfill
    depends_on:
      betime-app:
        condition: service_healthy
    command: ["/bin/sh", "/app/docker/embedding-backfill.sh"]
    volumes:
      - ./docker/embedding-backfill.sh:/app/docker/embedding-backfill.sh:ro
    environment:
      EMBEDDING_BACKFILL_TOKEN: ${EMBEDDING_BACKFILL_TOKEN:-local-betime-embedding-backfill}
      EMBEDDING_BACKFILL_INTERVAL_SECONDS: ${EMBEDDING_BACKFILL_INTERVAL_SECONDS:-300}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-nvidia/llama-nemotron-embed-vl-1b-v2:free}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: betime-nginx
    depends_on:
      betime-app:
        condition: service_healthy
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-19120}:80"
    restart: unless-stopped

  public-ingress:
    image: nginx:latest
    container_name: betime-public-ingress
    volumes:
      - ./docker/nginx/public-ingress.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PUBLIC_INGRESS_PORT:-9100}:80"
    restart: unless-stopped

volumes:
  betime-postgres-data:
