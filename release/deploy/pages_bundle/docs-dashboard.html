<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Intelligence Dashboard — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-search"></i> Document Intelligence Dashboard</h2></div>
    <div class="bt-kpi-grid">
      <div class="bt-card"><div class="bt-card-title">เอกสาร OCR แล้ว</div><div class="bt-card-value" id="doc-ocr">—</div><div class="bt-card-sub">ไฟล์</div></div>
      <div class="bt-card"><div class="bt-card-title">ร่างเอกสาร</div><div class="bt-card-value" id="doc-draft" style="color:var(--bt-primary)">—</div><div class="bt-card-sub">ฉบับ</div></div>
      <div class="bt-card"><div class="bt-card-title">สัญญาตรวจแล้ว</div><div class="bt-card-value" id="doc-contracts" style="color:var(--bt-success)">—</div><div class="bt-card-sub">ฉบับ</div></div>
      <div class="bt-card"><div class="bt-card-title">Compliance Score</div><div class="bt-card-value" id="doc-compliance" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">คะแนนเฉลี่ย</div></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px">
      <a href="/ocr-lab.html" class="bt-card" style="text-decoration:none;display:flex;align-items:center;gap:16px;padding:20px;cursor:pointer">
        <i class="bi bi-camera" style="font-size:2.5rem"></i>
        <div>
          <div style="font-weight:700;font-size:1rem">OCR Lab</div>
          <div style="font-size:0.82rem;color:#888;margin-top:4px">สแกนและอ่านข้อมูลจากเอกสาร</div>
        </div>
      </a>
      <a href="/smart-drafting.html" class="bt-card" style="text-decoration:none;display:flex;align-items:center;gap:16px;padding:20px;cursor:pointer">
        <i class="bi bi-pencil-square" style="font-size:2.5rem"></i>
        <div>
          <div style="font-weight:700;font-size:1rem">Smart Drafting</div>
          <div style="font-size:0.82rem;color:#888;margin-top:4px">ร่างเอกสารด้วย AI</div>
        </div>
      </a>
      <a href="/contract-check.html" class="bt-card" style="text-decoration:none;display:flex;align-items:center;gap:16px;padding:20px;cursor:pointer">
        <i class="bi bi-file-earmark-text" style="font-size:2.5rem"></i>
        <div>
          <div style="font-weight:700;font-size:1rem">Contract Check</div>
          <div style="font-size:0.82rem;color:#888;margin-top:4px">วิเคราะห์และตรวจสอบสัญญา</div>
        </div>
      </a>
      <a href="/compliance.html" class="bt-card" style="text-decoration:none;display:flex;align-items:center;gap:16px;padding:20px;cursor:pointer">
        <i class="bi bi-shield-check" style="font-size:2.5rem"></i>
        <div>
          <div style="font-weight:700;font-size:1rem">Compliance Score</div>
          <div style="font-size:0.82rem;color:#888;margin-top:4px">ตรวจสอบความสอดคล้องตามกฎ</div>
        </div>
      </a>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('docs-dashboard.html', 'Document Intelligence');
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const d = await BT.call('dashboard/docs', {}, 'GET');
      document.getElementById('doc-ocr').textContent        = d.ocr_count ?? 0;
      document.getElementById('doc-draft').textContent      = d.draft_count ?? 0;
      document.getElementById('doc-contracts').textContent  = d.contract_count ?? 0;
      document.getElementById('doc-compliance').textContent = d.avg_compliance ? d.avg_compliance + '%' : 'N/A';
    } catch(e) {
      if (e.message === 'Unauthorized') { BT.handleUnauthorized(); return; }
      ['doc-ocr','doc-draft','doc-contracts','doc-compliance'].forEach(id => {
        const el = document.getElementById(id); if(el) el.textContent = '0';
      });
    }
  });
</script>
</body>
</html>
