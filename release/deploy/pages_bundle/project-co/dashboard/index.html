<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project CO. Dashboard - Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header">
      <h2><i class="bi bi-building"></i> Project CO. Dashboard</h2>
      <button class="bt-btn bt-btn-primary bt-btn-sm" onclick="window.location='/project-co'"><i class="bi bi-list-check"></i> รายการทั้งหมด</button>
    </div>

    <!-- KPI row -->
    <div class="bt-kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:24px">
      <div class="bt-card">
        <div class="bt-card-title">โครงการทั้งหมด</div>
        <div class="bt-card-value" id="kpi-total">—</div>
        <div class="bt-card-sub">รายการ</div>
      </div>
      <div class="bt-card">
        <div class="bt-card-title">กำลังดำเนินการ</div>
        <div class="bt-card-value" id="kpi-active" style="color:var(--bt-accent)">—</div>
        <div class="bt-card-sub">โครงการ</div>
      </div>
      <div class="bt-card">
        <div class="bt-card-title">เสร็จสิ้นแล้ว</div>
        <div class="bt-card-value" id="kpi-done" style="color:var(--bt-success)">—</div>
        <div class="bt-card-sub">โครงการ</div>
      </div>
      <div class="bt-card">
        <div class="bt-card-title">งบประมาณรวม</div>
        <div class="bt-card-value" id="kpi-budget" style="color:var(--bt-warning)">—</div>
        <div class="bt-card-sub">ล้านบาท</div>
      </div>
      <div class="bt-card">
        <div class="bt-card-title">ความคืบหน้าเฉลี่ย</div>
        <div class="bt-card-value" id="kpi-progress" style="color:var(--bt-primary)">—</div>
        <div class="bt-card-sub">เปอร์เซ็นต์</div>
      </div>
    </div>

    <!-- Charts and Status -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="bt-card">
        <div style="font-size:0.88rem;font-weight:700;color:var(--bt-muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:16px">สถานะโครงการ</div>
        <div id="status-breakdown" style="display:flex;flex-direction:column;gap:10px"></div>
      </div>

      <div class="bt-card">
        <div style="font-size:0.88rem;font-weight:700;color:var(--bt-muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:16px">โครงการด่วน (เหลือ < 30%)</div>
        <div id="top-critical" style="display:flex;flex-direction:column;gap:8px"></div>
      </div>
    </div>

    <div class="bt-card">
      <div style="font-size:0.88rem;font-weight:700;color:var(--bt-muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:16px">โครงการล่าสุด</div>
      <div style="overflow-x:auto">
        <table class="bt-table">
          <thead>
            <tr>
              <th>ชื่อโครงการ</th>
              <th>แผนก</th>
              <th>ผู้รับผิดชอบ</th>
              <th>ความคืบหน้า</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="recent-table">
            <tr><td colspan="5" style="text-align:center;color:#888;padding:20px">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
BT.initApp('dashboard', 'Project CO. Dashboard');

const PROJECTS_DATA = [];
let projects = JSON.parse(localStorage.getItem('bt_co_projects') || 'null') || PROJECTS_DATA;

function renderKPI() {
  const total = projects.length;
  const active = projects.filter(p => p.status === 'Active').length;
  const done = projects.filter(p => p.status === 'Completed').length;
  const budget = projects.reduce((s,p) => s + Number(p.budget||0), 0);
  const progress = total ? Math.round(projects.reduce((s,p) => s + Number(p.progress||0), 0) / total) : 0;
  document.getElementById('kpi-total').textContent = total;
  document.getElementById('kpi-active').textContent = active;
  document.getElementById('kpi-done').textContent = done;
  document.getElementById('kpi-budget').textContent = (budget / 1000000).toFixed(2);
  document.getElementById('kpi-progress').textContent = progress + '%';
}

function renderStatus() {
  const statusCount = {
    Active: projects.filter(p => p.status === 'Active').length,
    Planning: projects.filter(p => p.status === 'Planning').length,
    Completed: projects.filter(p => p.status === 'Completed').length,
    'On Hold': projects.filter(p => p.status === 'On Hold').length,
  };
  const el = document.getElementById('status-breakdown');
  const total = Object.values(statusCount).reduce((a,b) => a+b, 0) || 1;
  el.innerHTML = Object.entries(statusCount)
    .filter(([, c]) => c > 0)
    .map(([status, count]) => {
      const pct = Math.round(count / total * 100);
      const color = status === 'Active' ? '#0ea5e9' : status === 'Completed' ? '#10b981' : status === 'Planning' ? '#f59e0b' : '#6b7280';
      return `<div style="display:flex;align-items:center;gap:10px">
        <div style="width:6px;height:24px;background:${color};border-radius:3px"></div>
        <span style="font-size:0.85rem;color:var(--bt-text)">${status} <strong>${count}</strong> (${pct}%)</span>
      </div>`;
    }).join('');
}

function renderCritical() {
  const critical = projects.filter(p => p.progress < 30 && p.status === 'Active').sort((a,b) => a.progress - b.progress);
  const el = document.getElementById('top-critical');
  if (critical.length === 0) {
    el.innerHTML = '<p style="color:#10b981;font-size:0.85rem">✓ ไม่มีโครงการด่วน</p>';
    return;
  }
  el.innerHTML = critical.slice(0,3).map(p => `
    <div style="padding:10px 12px;background:#fff;border:1px solid var(--bt-border);border-radius:10px">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
        <strong style="font-size:0.85rem">${p.name}</strong>
        <span style="color:var(--bt-danger);font-weight:700">${p.progress}%</span>
      </div>
      <div class="bt-progress" style="margin-top:8px"><div class="bt-progress-bar warning" style="width:${p.progress}%"></div></div>
    </div>
  `).join('');
}

function renderRecent() {
  const el = document.getElementById('recent-table');
  const list = projects.slice().sort((a,b) => (b.id||0) - (a.id||0)).slice(0,5);
  if (!list.length) {
    el.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:20px">ไม่พบข้อมูล</td></tr>';
    return;
  }
  el.innerHTML = list.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td>${p.dept || '-'}</td>
      <td>${p.owner || '-'}</td>
      <td>${Number(p.progress || 0)}%</td>
      <td>${p.status || '-'}</td>
    </tr>
  `).join('');
}

renderKPI();
renderStatus();
renderCritical();
renderRecent();
</script>
</body>
</html>
