<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>วิเคราะห์ Ticket - รับแจ้งเรื่อง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
  <style>
    body.betime-portal { background:#f6f9fd; font-family:'Sarabun', sans-serif; }
    .v3a-shell {
      position:relative;
      max-width:1500px;
      margin:0 auto;
      height:calc(100svh - 104px);
      min-height:600px;
      box-sizing:border-box;
    }
    .v3a-board {
      position:relative;
      display:grid;
      grid-template-columns:minmax(0, 2fr) minmax(320px, 1fr);
      grid-template-rows:auto minmax(0, 1fr);
      gap:10px;
      padding:10px;
      align-items:stretch;
      height:100%;
      min-height:0;
      background:linear-gradient(180deg,#f6f9fd 0%,#eef4fb 100%);
      border:1px solid #d8e2ef;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 18px 44px rgba(15,23,42,.07);
    }
    .v3a-left {
      grid-column:1;
      grid-row:2;
      display:flex;
      flex-direction:column;
      min-width:0;
      height:100%;
      min-height:0;
      background:linear-gradient(180deg,#ffffff 0%,#fbfdff 100%);
      border:1px solid #d8e2ef;
      border-radius:14px;
      box-shadow:0 8px 26px rgba(15,23,42,.04);
      overflow:hidden;
    }
    .v3a-right {
      grid-column:2;
      grid-row:2;
      display:grid;
      grid-template-rows:auto minmax(0, 1fr) auto;
      align-content:stretch;
      min-width:0;
      min-height:0;
      height:100%;
      align-self:stretch;
      overflow:hidden;
      background:#fff;
      border:1px solid #d8e2ef;
      border-radius:14px;
      box-shadow:0 8px 26px rgba(15,23,42,.04);
    }
    .v3a-left-head,
    .v3a-chat-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      padding:10px 18px 8px;
      border-bottom:1px solid #e6edf7;
    }
    .v3a-left-title,
    .v3a-ticket-title {
      margin:0;
      color:#0f172a;
      font-size:.98rem;
      font-weight:900;
      line-height:1.25;
    }
    .v3a-ticket-sub {
      margin-top:4px;
      color:#64748b;
      font-size:.78rem;
      font-weight:800;
    }
    .v3a-badge {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:6px 12px;
      font-size:.75rem;
      font-weight:900;
      white-space:nowrap;
      background:#fff7ed;
      color:#c2410c;
      border:1px solid #fed7aa;
    }
    .v3a-badge.low { background:#ecfdf5; color:#166534; border-color:#bbf7d0; }
    .v3a-badge.high { background:#fee2e2; color:#991b1b; border-color:#fecaca; }
    .v3a-left-body {
      display:flex;
      flex-direction:column;
      gap:5px;
      padding:8px 16px 10px;
      min-height:0;
      overflow:auto;
      scrollbar-width:thin;
      scrollbar-color:#b6c3d4 transparent;
    }
    .v3a-left-body::-webkit-scrollbar { width:6px; }
    .v3a-left-body::-webkit-scrollbar-track { background:transparent; }
    .v3a-left-body::-webkit-scrollbar-thumb {
      background:#b6c3d4;
      border-radius:999px;
    }
    .v3a-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      align-items:stretch;
    }
    .v3a-box {
      border:1px solid #dbe6f4;
      border-radius:11px;
      background:#fff;
      padding:6px 8px;
      min-width:0;
      align-self:stretch;
    }
    .v3a-grid > .v3a-box:not(.full) {
      height:64px;
      max-height:64px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      overflow:hidden;
    }
    .v3a-problem-box {
      height:76px;
      max-height:76px;
      position:relative;
      padding:7px 8px 8px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:3px;
      border-color:#ef4444;
      background:
        linear-gradient(180deg,#fff7f7 0%,#fff 76%),
        #fff;
      box-shadow:0 0 0 1px rgba(239,68,68,.18), 0 12px 28px rgba(239,68,68,.10);
      overflow:hidden;
      animation:v3aProblemPulse 1.9s ease-in-out infinite;
    }
    .v3a-problem-box::before {
      content:'';
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(105deg, transparent 0%, rgba(255,255,255,.0) 36%, rgba(255,255,255,.75) 48%, rgba(255,255,255,.0) 62%, transparent 100%);
      transform:translateX(-120%);
      animation:v3aProblemShine 2.8s ease-in-out infinite;
    }
    .v3a-problem-box::before {
      display:none;
    }
    .v3a-problem-box .v3a-k {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      color:#b91c1c;
      padding-right:112px;
      min-height:18px;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .v3a-problem-box .v3a-problem-label {
      display:block;
      position:relative;
      z-index:3;
      width:100%;
      box-sizing:border-box;
      padding-right:112px;
      color:#b91c1c;
      font-size:.68rem;
      font-weight:900;
      letter-spacing:.04em;
      line-height:1.2;
      min-height:16px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .v3a-problem-box .v3a-k > span:first-child {
      position:relative;
      z-index:2;
      display:block;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .v3a-problem-box .v3a-k,
    .v3a-problem-box .v3a-v {
      margin:0;
    }
    .v3a-problem-box .v3a-v {
      display:block;
      line-height:1;
      position:relative;
      z-index:2;
    }
    .v3a-problem-box .v3a-action-select {
      height:34px;
      margin-top:0 !important;
      display:block;
      border-color:#fca5a5;
      background:#fff;
      font-weight:900;
      padding-top:3px;
      padding-bottom:3px;
    }
    .v3a-problem-warning {
      position:absolute;
      top:6px;
      right:8px;
      z-index:1;
      display:inline-flex;
      align-items:center;
      gap:4px;
      color:#991b1b;
      background:#fee2e2;
      border:1px solid #fecaca;
      border-radius:999px;
      padding:1px 6px;
      width:max-content;
      max-width:100%;
      font-size:.62rem;
      font-weight:900;
      line-height:1.1;
      box-shadow:0 8px 18px rgba(239,68,68,.12);
    }
    .v3a-problem-warning::before {
      content:'!';
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:14px;
      height:14px;
      border-radius:999px;
      color:#fff;
      background:#dc2626;
      font-size:.62rem;
      font-weight:900;
    }
    .v3a-box.full { grid-column:1 / -1; }
    .v3a-k {
      margin-bottom:1px;
      color:#49607d;
      font-size:.64rem;
      font-weight:900;
      letter-spacing:.04em;
    }
    .v3a-v {
      color:#0f172a;
      font-size:.8rem;
      line-height:1.25;
      font-weight:700;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }
    .v3a-muted { color:#64748b; font-weight:700; }
    .v3a-action-box {
      grid-column:1 / -1;
      border-left:4px solid #1d4ed8;
      background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
    }
    .v3a-action-title {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      color:#0f172a;
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.03em;
      text-transform:uppercase;
    }
    .v3a-action-title::before {
      content:'Action';
      color:#1d4ed8;
    }
    .v3a-action-form {
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .v3a-action-row {
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .v3a-action-label {
      color:#49607d;
      font-size:.72rem;
      font-weight:900;
      letter-spacing:.03em;
    }
    .v3a-action-select {
      width:100%;
      height:38px;
      border:1px solid #cbd8e8;
      border-radius:12px;
      padding:0 12px;
      font:inherit;
      color:#0f172a;
      background:#fff;
      box-sizing:border-box;
      outline:none;
    }
    .v3a-action-note {
      color:#64748b;
      font-size:.75rem;
      line-height:1.45;
      font-weight:700;
    }
    .v3a-action-error {
      color:#dc2626;
      font-size:.74rem;
      line-height:1.4;
      font-weight:800;
    }
    .v3a-action-select.invalid {
      border-color:#fca5a5;
      background:#fff7f7;
      box-shadow:0 0 0 3px rgba(248,113,113,.12);
    }
    .v3a-action-buttons {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:2px;
    }
    .v3a-sla-box {
      border-left:1px solid #dbe6f4;
      background:#fff;
    }
    .v3a-sla-ticket-grid {
      grid-column:1 / -1;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      align-items:stretch;
    }
    .v3a-ticket-match-box {
      border-left:1px solid #dbe6f4;
      background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
    }
    .v3a-ticket-match-title {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      color:#49607d;
      font-size:.7rem;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .v3a-ticket-match-title::before {
      content:'MATCH';
      color:#1d4ed8;
    }
    .v3a-ticket-match-summary {
      display:flex;
      flex-direction:column;
      gap:5px;
      padding:8px 11px;
      border:1px solid #dbe6f4;
      border-radius:12px;
      background:#fff;
      cursor:pointer;
      transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    }
    .v3a-ticket-match-summary:hover {
      transform:translateY(-1px);
      border-color:#93c5fd;
      box-shadow:0 10px 22px rgba(29,78,216,.10);
    }
    .v3a-ticket-match-name {
      color:#0f172a;
      font-size:.88rem;
      font-weight:900;
      line-height:1.35;
    }
    .v3a-ticket-match-meta {
      color:#64748b;
      font-size:.76rem;
      font-weight:700;
      line-height:1.35;
    }
    .v3a-ticket-match-summary.warning {
      border-color:#dbe6f4;
      background:#fff;
    }
    .v3a-ticket-match-summary.danger {
      border-color:#dbe6f4;
      background:#fff;
    }
    .v3a-ticket-match-summary.warning .v3a-ticket-match-name,
    .v3a-ticket-match-summary.danger .v3a-ticket-match-name { color:#0f172a; }
    .v3a-ticket-match-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .v3a-ticket-count-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:34px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #bfdbfe;
      background:#eff6ff;
      color:#1d4ed8;
      font-size:.76rem;
      font-weight:900;
      line-height:1;
      box-shadow:0 8px 16px rgba(29,78,216,.10);
    }
    .v3a-sla-title {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      color:#49607d;
      font-size:.7rem;
      font-weight:900;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .v3a-sla-title::before {
      content:'SLA';
      color:#49607d;
    }
    .v3a-sla-loading,
    .v3a-sla-empty {
      color:#64748b;
      font-size:.82rem;
      font-weight:700;
      line-height:1.45;
    }
    .v3a-sla-list {
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .v3a-sla-item {
      display:flex;
      flex-direction:column;
      gap:1px;
      padding:8px 11px;
      border:1px solid #dbe6f4;
      border-radius:12px;
      background:#fff;
    }
    .v3a-sla-item.urgent {
      border-color:#fecaca;
      background:linear-gradient(180deg,#fff7f7 0%,#fff 100%);
    }
    .v3a-sla-item.active {
      border-color:#93c5fd;
      box-shadow:0 0 0 1px rgba(59,130,246,.12) inset;
      background:linear-gradient(180deg,#f8fbff 0%,#fff 100%);
    }
    .v3a-sla-name {
      color:#0f172a;
      font-size:.88rem;
      font-weight:800;
      line-height:1.4;
    }
    .v3a-sla-item.urgent .v3a-sla-name,
    .v3a-sla-item.urgent .v3a-sla-meta {
      color:#dc2626;
    }
    .v3a-sla-item.active .v3a-sla-name,
    .v3a-sla-item.active .v3a-sla-meta {
      color:#1d4ed8;
    }
    .v3a-sla-meta {
      color:#64748b;
      font-size:.76rem;
      font-weight:700;
      line-height:1.35;
    }
    .v3a-criteria-box {
      grid-column:1 / -1;
      border-left:4px solid #1d4ed8;
      background:linear-gradient(180deg,#fff 0%,#f8fbff 100%);
    }
    .v3a-criteria-title {
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:8px;
      color:#0f172a;
      font-size:.78rem;
      font-weight:900;
      letter-spacing:.03em;
      text-transform:uppercase;
    }
    .v3a-criteria-title::before {
      content:'Criteria';
      color:#1d4ed8;
    }
    .v3a-criteria-loading,
    .v3a-criteria-empty {
      color:#64748b;
      font-size:.82rem;
      font-weight:700;
      line-height:1.45;
    }
    .v3a-criteria-list {
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .v3a-criteria-item {
      display:flex;
      flex-direction:column;
      gap:2px;
      padding:8px 11px;
      border:1px solid #bfd0ff;
      border-radius:12px;
      background:#fff;
    }
    .v3a-criteria-item.primary {
      border-color:#1d4ed8;
      background:linear-gradient(180deg,#f8fbff 0%,#fff 100%);
    }
    .v3a-criteria-head {
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .v3a-criteria-name {
      color:#0f172a;
      font-size:.88rem;
      font-weight:800;
      line-height:1.4;
    }
    .v3a-criteria-name.primary {
      font-size:.96rem;
    }
    .v3a-criteria-meta {
      color:#64748b;
      font-size:.76rem;
      font-weight:700;
      line-height:1.35;
    }
    .v3a-subcriteria-list {
      margin:6px 0 0;
      padding-left:18px;
      border-left:2px solid #dbe6f4;
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .v3a-subcriteria-item {
      display:flex;
      flex-direction:column;
      gap:2px;
    }
    .v3a-ticket-history-list {
      display:flex;
      flex-direction:column;
      gap:7px;
      margin-top:8px;
    }
    .v3a-ticket-history-item {
      padding:9px 10px;
      border:1px solid #dbe6f4;
      border-radius:12px;
      background:linear-gradient(180deg,#fff 0%,#fbfdff 100%);
      box-shadow:0 5px 14px rgba(15,23,42,.035);
    }
    .v3a-ticket-history-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:5px;
    }
    .v3a-ticket-history-title {
      color:#0f172a;
      font-size:.82rem;
      font-weight:900;
      line-height:1.3;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .v3a-ticket-history-no {
      flex:0 0 auto;
      color:#1d4ed8;
      background:#eef2ff;
      border:1px solid #c7d2fe;
      border-radius:999px;
      padding:1px 7px;
      font-size:.72rem;
      font-weight:900;
      white-space:nowrap;
    }
    .v3a-ticket-history-meta {
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      margin-bottom:5px;
    }
    .v3a-ticket-history-chip {
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:2px 7px;
      border-radius:999px;
      border:1px solid #dbe6f4;
      background:#f8fbff;
      color:#49607d;
      font-size:.68rem;
      font-weight:800;
    }
    .v3a-ticket-history-chip.optional {
      display:none;
    }
    .v3a-ticket-history-body {
      color:#0f172a;
      font-size:.74rem;
      line-height:1.42;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      display:-webkit-box;
      -webkit-line-clamp:4;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }
    .v3a-ticket-history-note {
      margin-top:4px;
      color:#64748b;
      font-size:.7rem;
      font-weight:800;
    }
    .v3a-ticket-history-actions {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .v3a-ticket-evidence {
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .v3a-ticket-evidence-summary {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 14px;
      border:1px solid #dce3ee;
      border-radius:12px;
      background:#ffffff;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      min-height:0;
    }
    .v3a-ticket-evidence-title {
      color:#1c1e21;
      font-size:.84rem;
      font-weight:900;
      line-height:1.2;
      margin-bottom:0;
    }
    .v3a-ticket-evidence-meta {
      color:#65676b;
      font-size:.76rem;
      line-height:1.4;
      font-weight:600;
    }
    .v3a-ticket-evidence-count {
      flex:0 0 auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:0;
      padding:5px 9px;
      border-radius:999px;
      border:1px solid #d8dee8;
      background:#f7f8fa;
      color:#1d4ed8;
      font-size:.68rem;
      font-weight:900;
      white-space:nowrap;
    }
    .v3a-ticket-evidence-list {
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .v3a-ticket-evidence-folder {
      border:1px solid #dce3ee;
      border-radius:14px;
      background:#fff;
      box-shadow:0 1px 2px rgba(0,0,0,.08);
      overflow:hidden;
      box-sizing:border-box;
    }
    .v3a-ticket-evidence-folder.duplicate {
      border-color:#fed7aa;
      background:#fffaf5;
      box-shadow:inset 3px 0 0 #fb923c, 0 1px 2px rgba(0,0,0,.08);
    }
    .v3a-ticket-evidence-folder.similar {
      border-color:#dce3ee;
      background:#fff;
      box-shadow:inset 3px 0 0 #60a5fa, 0 1px 2px rgba(0,0,0,.08);
    }
    .v3a-ticket-evidence-folder summary {
      list-style:none;
      display:block;
      width:100%;
      margin:0;
      border:0;
      outline:none;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      box-sizing:border-box;
    }
    .v3a-ticket-evidence-folder summary::-webkit-details-marker {
      display:none;
    }
    .v3a-ticket-evidence-row {
      display:grid;
      grid-template-columns:92px minmax(0,1fr) auto 12px;
      gap:8px;
      align-items:center;
      padding:8px 10px;
      cursor:pointer;
      width:100%;
      margin:0;
      border:0;
      outline:none;
      box-sizing:border-box;
    }
    .v3a-ticket-evidence-row:focus,
    .v3a-ticket-evidence-row:focus-visible {
      outline:none;
      box-shadow:none;
    }
    .v3a-ticket-evidence-folder[open] .v3a-ticket-evidence-row {
      border-bottom:1px solid #eef2f7;
      background:rgba(248,250,252,.72);
    }
    .v3a-ticket-evidence-top {
      display:flex;
      flex-direction:row;
      align-items:center;
      justify-content:flex-start;
      gap:6px;
      margin-bottom:0;
      min-width:0;
    }
    .v3a-ticket-evidence-idwrap {
      display:flex;
      flex-direction:column;

<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <section class="v3a-shell">
      <div class="v3a-board" id="analysisRoot">
        <div class="v3a-empty">กำลังโหลดผลวิเคราะห์...</div>
      </div>
    </section>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('help-desk-v3-analysis.html', 'รับแจ้งเรื่อง');
  const storagePrefix = 'bt_helpdesk_v3_tickets::';
  let row = null;
  let activeMobileAnalysisTab = 'details';

  function esc(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');}
  function getUserKey(){try{const u=JSON.parse(localStorage.getItem('bt_user')||'{}')||{};return String(u.email||u.login||u.username||u.name||'guest').trim().toLowerCase()||'guest';}catch{return'guest';}}
  function storageKey(){return storagePrefix+getUserKey();}
  function loadRows(){try{return JSON.parse(localStorage.getItem(storageKey())||'[]')||[];}catch{return[];}}
  function saveRows(rows){localStorage.setItem(storageKey(),JSON.stringify((rows||[]).slice(0,500)));}
  function parseApiTicketRow(row){
    const extra = row && typeof row.extra === 'object' ? row.extra : {};
    return {
      ...(extra || {}),
      ...(row || {}),
      id: String(row?.id || extra?.id || ''),
      title: row?.title || extra?.title || extra?.issueTitle || '',
      description: row?.description || extra?.description || '',
      projectCode: extra?.projectCode || extra?.project_code || row?.project || '',
      projectName: extra?.projectName || extra?.project_name || '',
      subprojectCode: extra?.subprojectCode || extra?.subproject_code || extra?.sub_project || '',
      subprojectName: extra?.subprojectName || extra?.subproject_name || extra?.sub_project_name || '',
      odooTicketId: row?.odooTicketId || row?.odoo_ticket_id || extra?.odooTicketId || extra?.odoo_ticket_id || extra?.ticketNo || '',
      ticketNo: row?.odooTicketId || row?.odoo_ticket_id || extra?.odooTicketId || extra?.odoo_ticket_id || extra?.ticketNo || '',
      assignedDev: row?.assignedDev || row?.assigned_dev || extra?.assignedDev || extra?.assigned_dev || '',
      createdAt: row?.createdAt || row?.created_at || extra?.createdAt || extra?.created_at || '',
      updatedAt: row?.updatedAt || row?.updated_at || extra?.updatedAt || extra?.updated_at || '',
    };
  }
  async function fetchTicketRemote(id){
    const key = String(id || '').trim();
    if(!key) return null;
    try {
      const apiPath = window.BT && typeof BT.apiUrl === 'function'
        ? BT.apiUrl(`/helpdesk/tickets/${encodeURIComponent(key)}`)
        : `/api/helpdesk/tickets/${encodeURIComponent(key)}`;
      const res = await fetch(apiPath, { headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || !data.ok || !data.data) return null;
      return parseApiTicketRow(data.data);
    } catch {
      return null;
    }
  }
  async function saveTicketRemote(nextRow){
    const apiPath = window.BT && typeof BT.apiUrl === 'function'
      ? BT.apiUrl('/helpdesk/tickets')
      : '/api/helpdesk/tickets';
    const res = await fetch(apiPath, {
      method:'POST',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body:JSON.stringify(nextRow || {}),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok || !data.data) throw new Error(data.error || 'บันทึก Ticket ไม่สำเร็จ');
    return parseApiTicketRow(data.data);
  }
  let remoteSaveTimer = null;
  let remoteSaveChain = Promise.resolve();
  function cancelQueuedRemoteSave() {
    if (remoteSaveTimer) {
      clearTimeout(remoteSaveTimer);
      remoteSaveTimer = null;
    }
  }
  function queueRemoteTicketSave(nextRow) {
    const snapshot = { ...(nextRow || {}) };
    if (!String(snapshot.id || '').trim()) return;
    cancelQueuedRemoteSave();
    remoteSaveTimer = setTimeout(() => {
      remoteSaveTimer = null;
      remoteSaveChain = remoteSaveChain
        .catch(() => {})
        .then(async () => {
          try {
            const saved = await saveTicketRemote(snapshot);
            if (saved && String(row?.id || '') === String(saved.id || snapshot.id)) {
              upsertRow(saved, { persistRemote: false });
              row = saved;
            }
          } catch (error) {
            console.warn('บันทึกสถานะ Ticket อัตโนมัติไม่สำเร็จ', error);
          }
        });
    }, 250);
  }
  function authHeaders(){const t=localStorage.getItem('bt_token')||''; return t?{Authorization:'Bearer '+t}:{ };}
  const agentChatState = {
    seeded: false,
    messages: [],
  };
  let chatRequestInFlight = false;
  let chatImageAttachment = null;
  let chatImagePreviewUrl = '';
  let chatSessionId = '';
  let chatHistoryLoadToken = 0;
  const usedSuggestedChatPrompts = new Set();

  function getHelpdeskChatSessionStorageKey() {
    const ticketId = getHelpdeskChatTicketId();
    return ticketId ? `bt_helpdesk_v3_chat_session::${ticketId}` : '';
  }
  function loadStoredHelpdeskChatSessionId() {
    const key = getHelpdeskChatSessionStorageKey();
    if (!key) return '';
    try { return String(sessionStorage.getItem(key) || '').trim(); } catch { return ''; }
  }
  function saveStoredHelpdeskChatSessionId(sessionId = '') {
    const key = getHelpdeskChatSessionStorageKey();
    if (!key) return;
    try {
      if (sessionId) sessionStorage.setItem(key, String(sessionId).trim());
      else sessionStorage.removeItem(key);
    } catch {}
  }

  function clearChatImageAttachment() {
    chatImageAttachment = null;
    if (chatImagePreviewUrl) {
      try { URL.revokeObjectURL(chatImagePreviewUrl); } catch {}
      chatImagePreviewUrl = '';
    }
    const input = document.getElementById('chatImageInput');
    if (input) input.value = '';
    const preview = document.getElementById('chatImagePreview');
    if (preview) preview.hidden = true;
    const nameEl = document.getElementById('chatImageName');
    if (nameEl) nameEl.textContent = '';
    const imgEl = document.getElementById('chatImageThumb');
    if (imgEl) imgEl.removeAttribute('src');
  }

  function setChatImageAttachment(file) {
    if (!file) {
      clearChatImageAttachment();
      return;
    }
    if (!String(file.type || '').startsWith('image/')) {
      BT.notify('กรุณาเลือกไฟล์รูปภาพเท่านั้น', 'warning');
      return;
    }
    if (chatImagePreviewUrl) {
      try { URL.revokeObjectURL(chatImagePreviewUrl); } catch {}
      chatImagePreviewUrl = '';
    }
    const previewUrl = URL.createObjectURL(file);
    chatImagePreviewUrl = previewUrl;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = String(reader.result || '');
      if (!dataUrl.startsWith('data:image/')) {
        clearChatImageAttachment();
        BT.notify('ไฟล์รูปไม่ถูกต้อง', 'warning');
        return;
      }
      chatImageAttachment = {
        name: file.name || 'image',
        type: file.type || 'image/*',
        dataUrl,
      };
      const preview = document.getElementById('chatImagePreview');
      const nameEl = document.getElementById('chatImageName');
      const imgEl = document.getElementById('chatImageThumb');
      if (preview) preview.hidden = false;
      if (nameEl) nameEl.textContent = file.name || 'image';
      if (imgEl) imgEl.src = dataUrl;
    };
    reader.onerror = () => {
      clearChatImageAttachment();
      BT.notify('อ่านไฟล์รูปไม่สำเร็จ', 'warning');
    };
    reader.readAsDataURL(file);
  }
  function seedAgentChatState() {
    if (agentChatState.seeded) return;
    agentChatState.seeded = true;
    const opening = buildInitialManaMessages(row);
    agentChatState.messages = [
      { role: 'assistant', content: opening.title },
      { role: 'assistant', content: opening.detail },
    ];
  }
  function resetAgentChatThread() {
    agentChatState.seeded = false;
    agentChatState.messages = [];
    usedSuggestedChatPrompts.clear();
    seedAgentChatState();
    renderChatHistory(agentChatState.messages);
    refreshSuggestedChatPromptButtons();
  }
  function getHelpdeskChatTicketId() {
    return String(row?.id || row?.odoo_ticket_id || '').trim();
  }
  function getChatMessageParts(content) {
    if (Array.isArray(content)) return content;
    return [{ type: 'text', text: String(content || '').trim() }];
  }
  function sanitizeKnowledgeLabel(value) {
    const text = String(value || '').trim();
    if (!text) return '-';
    const looksTechnical = /(^|[\s:])(?:project|team|profile|knowledge|ticket)\b/i.test(text) || /[A-Z]{2,}[A-Z0-9_-]{2,}/.test(text);
    if (!/\s/.test(text) && !/[ก-๙]/.test(text)) return 'บทความความรู้ที่ใกล้เคียง';
    if (looksTechnical) return 'บทความความรู้ที่ใกล้เคียง';
    return text;
  }
  function safeParseJson(value, fallback = {}) {
    try {
      if (value && typeof value === 'object') return value;
      const text = String(value || '').trim();
      if (!text) return fallback;
      return JSON.parse(text);
    } catch {
      return fallback;
    }
  }
  function extractChatMessageText(content) {
    return getChatMessageParts(content).map((part) => {
      if (!part || typeof part !== 'object') return '';
      if (part.type === 'text') return String(part.text || '').trim();
      if (part.type === 'image_url') return '[image]';
      return '';
    }).filter(Boolean).join(' ').trim();
  }
  function renderStoredChatMessage(message = {}) {
    const role = String(message.role || 'user').trim().toLowerCase() === 'assistant' ? 'assistant' : 'user';
    const senderName = String(message.sender_name || message.senderName || (role === 'assistant' ? 'MANA' : '')).trim();
    const parts = getChatMessageParts(message.content || message.content_json?.content || message.content_json || message.content_text || '');
    if (role === 'assistant') {
      const textContent = parts.map((part) => {
        if (!part || typeof part !== 'object') return '';
        if (part.type === 'text') return String(part.text || '').trim();
        if (part.type === 'image_url') return '';
        return '';
      }).join('\n\n').trim();
      const replyBlocks = splitAssistantReplyIntoBubbles(textContent);
      return replyBlocks.map((replyText, index) => `
        <div class="v3a-msg assistant v3a-reveal" style="--delay:${index * 120}ms">
          <div class="v3a-msg-meta">${esc(senderName || 'MANA')}</div>
          <div class="v3a-msg-body">${esc(replyText || 'ยังไม่มีข้อความ').replace(/\n/g, '<br>')}</div>
        </div>`).join('');
    }
    const bodyHtml = parts.map((part) => {
      if (!part || typeof part !== 'object') return '';
      if (part.type === 'text') {
        return esc(String(part.text || '').trim()).replace(/\n/g, '<br>');
      }
      if (part.type === 'image_url' && part.image_url?.url) {
        return `<div style="margin-top:10px"><img src="${esc(part.image_url.url)}" alt="${esc(part.image_url.alt || 'แนบรูป')}" style="max-width:240px;width:100%;border-radius:12px;border:1px solid #dbe6f4;background:#f8fbff;display:block"></div>`;
      }
      return '';
    }).join('') || `<span class="v3a-muted"></span>`;
    return `
      <div class="v3a-msg user v3a-reveal">
        <div class="v3a-msg-body">${bodyHtml}</div>
      </div>`;
  }
  function renderChatHistory(messages = []) {
    const thread = document.querySelector('#chatMessages .v3a-thread');
    if (!thread) return;
    thread.innerHTML = Array.isArray(messages) && messages.length
      ? messages.map((message) => renderStoredChatMessage(message)).join('')
      : thread.innerHTML;
  }
  function splitAssistantReplyIntoBubbles(reply) {
    const raw = String(reply || '').replace(/\r\n?/g, '\n').trim();
    if (!raw) return ['ยังไม่มีข้อความ'];
    const paragraphs = raw
      .split(/\n\s*\n+/)
      .map((paragraph) => paragraph
        .split('\n')
        .map((line) => line.trim())
        .filter(Boolean)
        .join(' ')
        .replace(/\s+/g, ' ')
      .trim())
      .filter(Boolean);
    if (paragraphs.length <= 1) return [paragraphs[0] || raw];

    const firstParagraph = paragraphs[0] || '';
    const secondParagraph = paragraphs[1] || '';
    const firstLooksLikeIntro = firstParagraph.length <= 70
      && /^(ผมว่า|น่าจะ|จากข้อมูล|สรุป|ลอง|ขั้นแรก|วิธี|ตอนนี้|ปัญหานี้)/.test(normalizeText(firstParagraph));
    const secondLooksLikeContinuation = /^(จากข้อมูล|เพราะ|ถ้า|ถ้ายัง|หาก|และ|พร้อม|โดย|เดี๋ยว|รบกวน)/.test(normalizeText(secondParagraph));
    if (firstLooksLikeIntro && secondLooksLikeContinuation) {
      paragraphs.splice(0, 2, `${firstParagraph} ${secondParagraph}`.replace(/\s+/g, ' ').trim());
    }

    const classify = (text) => {
      const blob = normalizeText(text);
      if (!blob) return 'other';
      if (/(\?|^|[\s,])(ขอ|รบกวน|ช่วย|กรุณา|แจ้ง|ส่ง|แนบ|บอก|ยืนยัน|ต้องการ|ต้องเอา|ต้องใช้)/.test(blob) || /^(ถ้า|ถ้าจะ|ถ้ายัง|หาก)\b/.test(blob)) {
        return 'request';
      }
      if (/(ลอง|เช็ก|ตรวจ|สลับ|รีเฟรช|logout|เข้าใหม่|ทดสอบ|แก้|รีเซต|เริ่ม|ขั้นแรก|วิธี|แนะนำ|ดำเนินการ|ทำซ้ำ|เก็บ|ตรวจสอบ)/.test(blob)) {
        return 'action';
      }
      if (/(จากข้อมูล|น่าจะ|ดูเหมือน|สรุป|ประเด็น|เป็นไปได้|มีแนวโน้ม|คาดว่า|ตอนนี้)/.test(blob)) {
        return 'summary';
      }
      return 'other';
    };

    const bubbles = [];
    let current = paragraphs[0];
    let currentRole = classify(current);
    for (const paragraph of paragraphs.slice(1)) {
      const nextRole = classify(paragraph);
      const looksLikeContinuation = /^(และ|พร้อม|รวมถึง|อีกทั้ง|โดย|จากนั้น)\b/.test(normalizeText(paragraph));
      const shouldMerge = (
        nextRole === currentRole && (current.length + paragraph.length) < 240
      ) || (
        current.length < 90 && looksLikeContinuation
      );
      if (shouldMerge) {
        current = `${current}\n\n${paragraph}`;
        continue;
      }
      bubbles.push(current);
      current = paragraph;
      currentRole = nextRole;
    }
    bubbles.push(current);
    if (bubbles.length > 3) {
      return [bubbles[0], bubbles[1], bubbles.slice(2).join('\n\n')];
    }
    return bubbles;
  }
  function appendAssistantReplyBubbles(container, reply, delayStep = 0) {
    const bubbles = splitAssistantReplyIntoBubbles(reply);
    bubbles.forEach((text, index) => {
      const assistant = document.createElement('div');
      assistant.className = 'v3a-msg assistant v3a-reveal';
      assistant.style.setProperty('--delay', `${delayStep + (index * 120)}ms`);
      assistant.innerHTML = `<div class="v3a-msg-meta">MANA</div><div class="v3a-msg-body">${esc(String(text || '').trim() || 'ยังไม่มีข้อความ').replace(/\n/g, '<br>')}</div>`;
      container.appendChild(assistant);
    });
  }
  function createTypingBubble(label = 'MANA กำลังพิมพ์') {
    const assistant = document.createElement('div');
    assistant.className = 'v3a-msg assistant v3a-reveal v3a-typing-bubble';
    assistant.style.setProperty('--delay', '90ms');
    assistant.dataset.loading = '1';
    assistant.innerHTML = `
      <div class="v3a-msg-meta">MANA</div>
      <div class="v3a-msg-body">
        <span class="v3a-typing-indicator">
          <span>${esc(label)}</span>
          <span class="v3a-typing-dots" aria-hidden="true">
            <span class="v3a-typing-dot"></span>
            <span class="v3a-typing-dot"></span>
            <span class="v3a-typing-dot"></span>
          </span>
        </span>
      </div>`;
    return assistant;
  }
  function resizeChatComposerInput(input = document.getElementById('chatInput')) {
    if (!input) return;
    input.style.height = '0px';
    const next = Math.min(Math.max(input.scrollHeight, 22), 96);
    input.style.height = `${next}px`;
  }
  function getChatPromptResponseMode(prompt) {
    const text = normalizeText(prompt);
    if (/มีวิธี|แก้ไขเบื้องต้น|วิธีแก้|แก้ยังไง|fix|solution/.test(text)) return 'fix_first';
    if (/ต้องเอาข้อมูล|ข้อมูลตรงไหน|ขออะไร|ส่งอะไร|เตรียมอะไร|evidence/.test(text)) return 'evidence_request';
    if (/ขั้นตอน|ถัดไป|ต่อไป|ควรทำ|next/.test(text)) return 'next_step';
    if (/ส่ง dev|เลือกเดฟ|assign|developer/.test(text)) return 'dev_decision';
    if (/ตอบลูกค้า|ร่างคำตอบ|แจ้งกลับ/.test(text)) return 'customer_reply';
    if (/สรุป|summary/.test(text)) return 'summary';
    return '';
  }
  function sendSuggestedChatPrompt(value, responseMode = '') {
    const input = document.getElementById('chatInput');
    if (!input) return;
    const prompt = String(value || '').trim();
    if (!prompt || chatRequestInFlight) return;
    usedSuggestedChatPrompts.add(prompt);
    refreshSuggestedChatPromptButtons();
    input.value = prompt;
    resizeChatComposerInput(input);
    sendChatMessage({ responseMode: responseMode || getChatPromptResponseMode(prompt) });
  }
  function refreshSuggestedChatPromptButtons() {
    document.querySelectorAll('[data-chat-prompt]').forEach((button) => {
      const prompt = String(button.getAttribute('data-chat-prompt') || '').trim();
      const used = usedSuggestedChatPrompts.has(prompt);
      button.disabled = chatRequestInFlight;
      button.classList.toggle('is-used', used);
      if (chatRequestInFlight) button.setAttribute('aria-disabled', 'true');
      else button.removeAttribute('aria-disabled');
    });
  }
  async function loadPersistedTicketChat() {
    const ticketId = getHelpdeskChatTicketId();
    if (!ticketId) return;
    const loadToken = ++chatHistoryLoadToken;
    try {
      const storedSessionId = loadStoredHelpdeskChatSessionId();
      const sessionQuery = storedSessionId ? `?session_id=${encodeURIComponent(storedSessionId)}` : '';
      const res = await fetch(`/api/helpdesk/tickets/${encodeURIComponent(ticketId)}/chat${sessionQuery}`, {
        method: 'GET',
        headers: authHeaders(),
      });
      const data = await res.json().catch(() => ({}));
      if (loadToken !== chatHistoryLoadToken) return;
      const rows = Array.isArray(data.data) ? data.data : [];
      const sessionId = String(data.session_id || storedSessionId || '').trim();
      chatSessionId = sessionId;
      saveStoredHelpdeskChatSessionId(sessionId);
      if (!rows.length) return;
      const messages = rows.map((item) => {
        const parsed = safeParseJson(item.content_json || '{}', {});
        return {

        const normalized = normalizeLabel(noNumber);

      : /error|timeout|api|server|endpoint/.test(combined)

                  ];

    if (hasDbHints) {
      return genericReplyItems;
    }
    if (hasHumanHints || type === 'Human error') {
      return genericReplyItems;
    }
    if (hasChangeHints || type === 'Change Request') {
      return genericReplyItems;
    }
    if (hasBugHints || type === 'System Bug') {
      return genericReplyItems;
    }
    if (/system error|server|timeout|api|endpoint|fail|error/.test(context) || type === 'system error') {
      return genericReplyItems;
    }
    if (hasNetworkHints || type === 'network') {
      return genericReplyItems;
    }
    if (hasHardwareHints || type === 'hardware') {
      return genericReplyItems;
    }
    if (hasImageOrErrorHints || /screenshot|image|รูป|ภาพ/.test(context)) {
      return genericReplyItems;
    }
    return genericReplyItems;

  async function sendChatMessage(options = {}) {
    seedAgentChatState();
    const responseMode = String(options?.responseMode || '').trim();
    const input = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendChatBtn');
    const text = String(input?.value || '').trim();
    const attachment = chatImageAttachment && chatImageAttachment.dataUrl
      ? { ...chatImageAttachment }
      : null;
    if ((!text && !attachment) || chatRequestInFlight) return;
    chatRequestInFlight = true;
    refreshSuggestedChatPromptButtons();
    if (input) input.disabled = true;
    if (sendBtn) sendBtn.disabled = true;
    const box = document.getElementById('chatMessages');
    const userMessage = document.createElement('div');
    userMessage.className = 'v3a-msg user v3a-reveal';
    userMessage.style.setProperty('--delay', '0ms');
    userMessage.innerHTML = attachment
      ? `
        <div class="v3a-msg-body">
          ${text ? esc(text) : '<span class="v3a-muted">[แนบรูปภาพ]</span>'}
          <div style="margin-top:10px">
            <img src="${esc(attachment.dataUrl)}" alt="${esc(attachment.name)}" style="max-width:240px;width:100%;border-radius:12px;border:1px solid #dbe6f4;background:#f8fbff;display:block">
          </div>
        </div>`
      : `<div class="v3a-msg-body">${esc(text)}</div>`;
    box.appendChild(userMessage);
    input.value = '';
    resizeChatComposerInput(input);
    const loading = createTypingBubble();
    box.appendChild(loading);
    box.scrollTop = box.scrollHeight;
    const userContent = attachment
      ? [
          ...(text ? [{ type: 'text', text }] : []),
          { type: 'image_url', image_url: { url: attachment.dataUrl } },
        ]
      : text;
    const payload = {
      ticketContext: buildChatTicketContext({ includeLinkedEvidence: false }),
      responseMode,
      messages: [
        ...agentChatState.messages,
        { role: 'user', content: userContent },
      ],
    };
    clearChatImageAttachment();
    try {
      const res = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          ...authHeaders(),
        },
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      loading.remove();
      if (!res.ok || data?.ok === false) {
        throw new Error(data?.error || `AI request failed (${res.status})`);
      }
      const reply = shortenAssistantReply(String(data.reply || '').trim());
      if (!reply) {
        throw new Error('AI returned an empty reply');
      }
      agentChatState.messages.push({ role: 'user', content: userContent });
      agentChatState.messages.push({ role: 'assistant', content: reply });
      appendAssistantReplyBubbles(box, reply, 0);
      await persistTicketChatMessages([
        { role: 'user', content: userContent },
        { role: 'assistant', content: reply, sender_name: 'MANA' },
      ]);
      box.scrollTop = box.scrollHeight;
    } catch (err) {
      loading.remove();
      agentChatState.messages.push({ role: 'user', content: userContent });
      appendAssistantReplyBubbles(box, err?.message || 'เกิดข้อผิดพลาด', 0);
      agentChatState.messages.push({ role: 'assistant', content: String(err?.message || 'เกิดข้อผิดพลาด') });
      box.scrollTop = box.scrollHeight;
    } finally {
      chatRequestInFlight = false;
      if (input) {
        input.disabled = false;
        input.focus();
      }
      if (sendBtn) sendBtn.disabled = false;
      refreshSuggestedChatPromptButtons();
    }
  }

            const displayNames = Array.isArray(extra.team_member_display_names) && extra.team_member_display_names.length ? extra.team_member_display_names : [];
            const fallbackId = extractNumericId(extra.owner_id, item?.owner_id, item?.source_id, extra.source_id);
            const fallbackName = String(extra.owner_name || extra.team_name_th || extra.team_name_en || item?.name || '').trim();
            const rows = [];
            const maxLen = Math.max(ids.length, refs.length, names.length, displayNames.length, fallbackId ? 1 : 0);
            for (let i = 0; i < maxLen; i += 1) {
              const memberId = extractNumericId(ids[i], refs[i], fallbackId);
              const memberName = String(displayNames[i] || names[i] || fallbackName).trim();
              if (!memberId || !memberName || hasBrokenName(memberName)) continue;
              rows.push({
                memberId,
                memberName,
                teamId: extractNumericId(extra.source_id, item?.source_id, item?.id),
                teamName: String(extra.team_name_th || extra.team_name_en || item?.name || fallbackName).trim(),
                roleRowId: String(item?.id || '').trim(),
              });
            }
            if (!rows.length && fallbackId && fallbackName && !hasBrokenName(fallbackName)) {
              rows.push({
                memberId: fallbackId,
                memberName: fallbackName,
                teamId: extractNumericId(extra.source_id, item?.source_id, item?.id),
                teamName: String(extra.team_name_th || extra.team_name_en || item?.name || fallbackName).trim(),
                roleRowId: String(item?.id || '').trim(),
              });
            }
            return rows;
          };
          teamDevMatches.forEach((item) => {
            const extra = parseExtra(item);
            const members = collectTeamMembers(item, extra);
            members.forEach((member, index) => {
              addDevOption(
                `${member.memberId || 'team'}__${String(item?.id || index)}`,
                member.memberName,
                member.teamName,
                `${member.memberId}:${member.teamId}:${member.memberName}`,
                {
                  employeeId: member.memberId,
                  teamId: member.teamId,
                  teamName: member.teamName,
                  roleRowId: member.roleRowId,
                }
              );
            });
          });
        }

        const teamGroupsMap = new Map();
        devOptions.forEach((item) => {
          const teamId = String(item.teamId || '').trim();
          const teamName = String(item.teamName || '').trim();
          const key = teamId || teamName || 'team_unknown';
          if (!teamGroupsMap.has(key)) {
            teamGroupsMap.set(key, {
              key,
              teamId,
              teamName: teamName || 'ทีมไม่ระบุ',
              members: [],
            });
          }
          teamGroupsMap.get(key).members.push(item);
        });
        const teamGroups = Array.from(teamGroupsMap.values()).sort((a, b) => a.teamName.localeCompare(b.teamName, 'th'));
        const buildTeamOptionsHtml = (selectedKey = '') => {
          if (!teamGroups.length) return `<option value="">ยังไม่พบทีมที่ผูกกับโปรเจกต์นี้</option>`;

            `<option value="">เลือกทีม</option>`,
            ...teamGroups.map((group) => {
              const selected = selectedKey && selectedKey === group.key ? ' selected' : '';
              return `<option value="${esc(group.key)}" data-team-id="${esc(group.teamId || '')}" data-team-name="${esc(group.teamName || '')}"${selected}>${esc(group.teamName || group.key)}</option>`;
            }),
          ].join('');
        };
        const buildMemberOptionsHtml = (teamKey = '', selectedEmployeeId = '') => {
          const group = teamGroups.find((entry) => entry.key === teamKey) || teamGroups[0] || null;
          const members = group?.members || [];
          if (!members.length) return `<option value="">ยังไม่พบรายชื่อในทีมนี้</option>`;
          return [
            `<option value="">เลือกคน</option>`,

              const value = String(item.selectionValue || item.employeeId || item.value || '').trim();
              const selected = selectedEmployeeId && selectedEmployeeId === value ? ' selected' : '';
              return `<option value="${esc(value)}" data-employee-id="${esc(item.employeeId || value)}" data-team-id="${esc(item.teamId || '')}" data-team-name="${esc(item.teamName || '')}" data-role-row-id="${esc(item.roleRowId || '')}"${selected}>${esc(item.display || item.label)}</option>`;
            }),
          ].join('');
        };

        const selfLabel = currentUserName;
        const teamOptionsHtml = buildTeamOptionsHtml();
        const memberOptionsHtml = buildMemberOptionsHtml();
        const selfOptionsHtml = `<option value="${esc(selfLabel)}">${esc(selfLabel)}</option>`;
        const devCountNote = devOptions.length ? `พบรายชื่อ Dev ${devOptions.length} คน ใน ${teamGroups.length} ทีม` : 'ยังไม่พบ Dev ที่ผูกกับโปรเจกต์นี้';
        const hintText = devOptions.length
          ? 'ถ้าเลือกส่งต่อ Dev จะดึงรายชื่อ Dev จาก Role ของโปรเจกต์นี้ ถ้าเลือกปิดเคสด้วยตนเองจะใช้ชื่อผู้ใช้งานปัจจุบัน'
          : 'ยังไม่พบรายชื่อ Dev จากข้อมูลโปรเจกต์นี้';
        box.innerHTML = `
          <div class="v3a-action-form">
            <div class="v3a-action-row">
              <div class="v3a-action-label">เลือกการดำเนินการ</div>
              <select class="v3a-action-select" id="routeModeSelect">
                <option value="">เลือก...</option>
                <option value="forward">ส่งต่อ Dev</option>
                <option value="self">ปิดเคสด้วยตนเอง</option>
              </select>
            </div>
            <div class="v3a-action-row" id="routeTargetWrap" hidden>
              <div class="v3a-action-label" id="routeTeamLabel">เลือกทีม</div>
              <select class="v3a-action-select" id="routeTeamSelect">${teamOptionsHtml}</select>
              <div class="v3a-action-note" id="routeTeamNote">${esc(devCountNote)}</div>
            </div>
            <div class="v3a-action-row" id="routeMemberWrap" hidden>
              <div class="v3a-action-label" id="routeTargetLabel">เลือกคนในทีม</div>
              <select class="v3a-action-select" id="routeTargetSelect">${memberOptionsHtml}</select>
              <div class="v3a-action-note" id="routeTargetNote">${esc(devCountNote)}</div>
            </div>
            <div class="v3a-action-error" id="routeValidationNote" hidden>กรุณาเลือกการดำเนินการก่อนยืนยัน</div>
            <div class="v3a-action-note">${esc(hintText)}</div>
          </div>
        `;

        const modeSelect = document.getElementById('routeModeSelect');
        const targetWrap = document.getElementById('routeTargetWrap');
        const memberWrap = document.getElementById('routeMemberWrap');
        const teamSelect = document.getElementById('routeTeamSelect');
        const targetLabel = document.getElementById('routeTargetLabel');
        const targetSelect = document.getElementById('routeTargetSelect');
        const teamLabel = document.getElementById('routeTeamLabel');
        const teamNote = document.getElementById('routeTeamNote');
        const targetNote = document.getElementById('routeTargetNote');
        const resolveSelectedTeam = () => {
          const key = String(teamSelect?.value || '').trim();
          return teamGroups.find((entry) => entry.key === key) || teamGroups[0] || null;
        };
        const refreshMemberOptions = (preferredEmployeeId = '') => {
          if (!targetSelect) return;
          const team = resolveSelectedTeam();
          targetSelect.innerHTML = buildMemberOptionsHtml(team?.key || '', preferredEmployeeId);
          if (!preferredEmployeeId && team?.members?.length) {
            const firstMember = team.members.find((item) => String(item.selectionValue || item.employeeId || item.value || '').trim()) || team.members[0];
            if (firstMember) targetSelect.value = String(firstMember.selectionValue || firstMember.employeeId || firstMember.value || '').trim();
          }
          if (targetNote) {
            targetNote.textContent = team ? `${team.teamName} - ${team.members.length} คน` : devCountNote;
          }
        };
        const validateRouteSelection = () => {
          const mode = String(modeSelect?.value || '').trim();
          const teamValue = String(teamSelect?.value || '').trim();
          const targetValue = String(targetSelect?.value || '').trim();
          if (!mode) {
            return { valid:false, message:'กรุณาเลือกการดำเนินการก่อนยืนยัน' };
          }
          if (mode === 'forward' && !teamValue) {
            return { valid:false, message:'กรุณาเลือกทีมก่อนยืนยัน' };
          }
          if (mode === 'forward' && !targetValue) {
            return { valid:false, message:'กรุณาเลือกคนในทีมก่อนยืนยัน' };
          }
          return { valid:true, message:'' };
        };
        const syncConfirmButtonState = () => {
          const confirmBtn = document.getElementById('chatConfirmBtn');
          const validationNote = document.getElementById('routeValidationNote');
          const state = validateRouteSelection();
          if (confirmBtn) {
            confirmBtn.disabled = !state.valid;
            confirmBtn.setAttribute('aria-disabled', state.valid ? 'false' : 'true');
            confirmBtn.title = state.valid ? '' : state.message;
          }
          if (modeSelect) modeSelect.classList.toggle('invalid', !String(modeSelect.value || '').trim());
          if (targetSelect) {
            const needsTarget = String(modeSelect?.value || '') === 'forward';
            targetSelect.classList.toggle('invalid', needsTarget && !String(targetSelect.value || '').trim());
          }
          if (validationNote) {
            validationNote.hidden = state.valid;
            validationNote.textContent = state.message || '';
          }
          return state;
        };
        let appliedRouteKey = '';
        const applyRoute = () => {
          const mode = String(modeSelect?.value || '');
          const selectedTeamOption = teamSelect?.selectedOptions?.[0] || null;
          const teamValue = String(teamSelect?.value || '').trim();
          const teamId = String(selectedTeamOption?.dataset?.teamId || '').trim();
          const teamName = String(selectedTeamOption?.dataset?.teamName || selectedTeamOption?.textContent || '').trim();
          const targetValue = String(targetSelect?.value || '').trim();
          const selectedOption = targetSelect?.selectedOptions?.[0] || null;
          const targetLabel = String(selectedOption?.textContent || targetValue).trim();
          const targetEmployeeId = String(selectedOption?.dataset?.employeeId || '').trim();
          const targetTeamId = String(selectedOption?.dataset?.teamId || '').trim();
          const targetTeamName = String(selectedOption?.dataset?.teamName || '').trim();
          const routeKey = `${mode}:${targetValue || targetLabel}`;
          if (!mode || routeKey === appliedRouteKey) return;
          if (mode === 'forward') {
            if (!teamGroups.length) {
              BT.notify('ไม่พบทีมที่ผูกกับโปรเจกต์นี้', 'warning');
              return;
            }
            if (!teamValue) {
              BT.notify('กรุณาเลือกทีมก่อน', 'warning');
              return;
            }
            if (!targetValue) return;
            appliedRouteKey = routeKey;
            row = {
              ...row,
              assignedDev: targetLabel,
              routeMode: 'forward',
              routeTarget: targetValue,
              routeTargetLabel: targetLabel,
              routeTargetEmployeeId: targetEmployeeId,
              delegateOfficer: targetLabel,
              delegateOfficerId: targetEmployeeId,
              delegateTeamId: teamId || targetTeamId,
              delegateTeam: teamName || targetTeamName,
              assignDevRows: targetLabel ? [{
                 assign_emp_id: targetEmployeeId,
                 assign_emp_name: targetLabel,
                assign_status: 'assign',
              }] : [],
              status: 'process',
            };
            upsertRow(row);
            return;
          }
          if (mode === 'self') {
            appliedRouteKey = routeKey;
            row = {
              ...row,
              assignedDev: selfLabel,
              routeMode: 'self',
              routeTarget: selfLabel,
              routeTargetLabel: selfLabel,
              routeTargetEmployeeId: '',
              delegateOfficer: '',
              delegateOfficerId: '',
              delegateTeamId: '',
              delegateTeam: '',
              assignDevRows: [],
              status: 'draft',
            };
            upsertRow(row);
            BT.notify(`ปิดเคสด้วยตนเอง: ${selfLabel}`, 'success');
          }
        };
        const syncRouteUI = () => {
          const mode = String(modeSelect?.value || '');
          if (!targetWrap || !targetLabel || !targetSelect || !teamSelect) return;
          if (mode === 'forward') {
            targetWrap.hidden = false;
            if (memberWrap) memberWrap.hidden = false;
            targetLabel.textContent = 'เลือกคนในทีม';
            if (teamLabel) teamLabel.textContent = 'เลือกทีม';
            if (teamNote) teamNote.textContent = devCountNote;
            if (!teamSelect.value && teamGroups[0]) teamSelect.value = teamGroups[0].key;
            refreshMemberOptions(String(targetSelect.value || '').trim());
            targetSelect.disabled = false;
          } else if (mode === 'self') {
            targetWrap.hidden = false;
            if (memberWrap) memberWrap.hidden = true;
            targetLabel.textContent = 'ชื่อของคุณ';
            targetSelect.innerHTML = selfOptionsHtml;
            targetSelect.value = selfLabel;
            targetSelect.disabled = false;
            if (teamLabel) teamLabel.textContent = 'เลือกทีม';
            if (teamNote) teamNote.textContent = 'จะใช้ทีมของผู้ใช้งานปัจจุบัน';
            if (targetNote) targetNote.textContent = 'จะใช้ชื่อผู้ใช้งานปัจจุบัน';
          } else {
            targetWrap.hidden = true;
            if (memberWrap) memberWrap.hidden = true;
            targetSelect.disabled = true;
            if (targetNote) targetNote.textContent = devCountNote;
          }
          syncConfirmButtonState();
        };
        modeSelect?.addEventListener('change', () => {
          appliedRouteKey = '';
          syncRouteUI();
          const nextMode = String(modeSelect?.value || '');
          if (nextMode === 'forward' || nextMode === 'self') applyRoute();
          syncConfirmButtonState();
        });
        teamSelect?.addEventListener('change', () => {
          appliedRouteKey = '';
          refreshMemberOptions();
          if (String(modeSelect?.value || '') === 'forward') applyRoute();
          syncConfirmButtonState();
        });
        targetSelect?.addEventListener('change', () => {
          if (String(modeSelect?.value || '') === 'forward') applyRoute();
          syncConfirmButtonState();
        });
        const savedMode = String(row.routeMode || '').trim();
        const savedTarget = String(row.routeTarget || '').trim();
        const savedTeamId = String(row.delegateTeamId || row.delegate_team_id || '').trim();
        if (savedMode === 'forward' || savedMode === 'self') {
          modeSelect.value = savedMode;
        }
        syncRouteUI();
        if (modeSelect?.value === 'forward') {
          if (savedTeamId) {
            const teamOptionValues = Array.from(teamSelect?.options || []).map((option) => String(option.value || '').trim());
            if (teamOptionValues.includes(savedTeamId)) teamSelect.value = savedTeamId;
          }
          refreshMemberOptions(savedTarget);
          const optionValues = Array.from(targetSelect?.options || []).map((option) => String(option.value || '').trim());
          if (optionValues.includes(savedTarget)) {
            targetSelect.value = savedTarget;
          }
          applyRoute();
        }
        if (modeSelect?.value === 'self') {
          targetSelect.value = selfLabel;
        }
        syncConfirmButtonState();
      } catch (err) {
        const fallbackSelfName = getCurrentUserDisplayName() || 'ผู้ใช้งานปัจจุบัน';
        const fallbackForwardName = String(row.assignedDev || row.routeTargetLabel || row.routeTarget || '').trim();
        box.innerHTML = `
          <div class="v3a-action-form">
            <div class="v3a-action-row">
              <div class="v3a-action-label">เลือกการดำเนินการ</div>
              <select class="v3a-action-select" id="routeModeSelect">
                <option value="">เลือก...</option>
                <option value="forward">ส่งต่อ Dev</option>
                <option value="self">ปิดเคสด้วยตนเอง</option>
              </select>
            </div>
            <div class="v3a-action-row" id="routeTargetWrap" hidden>
              <div class="v3a-action-label" id="routeTargetLabel">ปลายทางการส่งต่อ</div>
              <input class="v3a-action-select" id="routeTargetInput" type="text" placeholder="ระบุชื่อ Dev หรือผู้รับเคส" value="${esc(fallbackForwardName)}">
              <div class="v3a-action-note" id="routeTargetNote">ถ้าโหลดรายชื่ออัตโนมัติไม่สำเร็จ ยังระบุชื่อปลายทางเองได้</div>
            </div>
            <div class="v3a-action-error" id="routeValidationNote" hidden>กรุณาเลือกการดำเนินการก่อนยืนยัน</div>
            <div class="v3a-action-note">โหลดรายชื่อปลายทางไม่สำเร็จ ระบบจึงเปิดโหมดกรอกชื่อปลายทางเองแทน</div>
          </div>
        `;
        const confirmBtn = document.getElementById('chatConfirmBtn');
        const modeSelect = document.getElementById('routeModeSelect');
        const targetWrap = document.getElementById('routeTargetWrap');
        const targetLabel = document.getElementById('routeTargetLabel');
        const targetInput = document.getElementById('routeTargetInput');
        const validationNote = document.getElementById('routeValidationNote');
        const syncFallbackState = () => {
          const mode = String(modeSelect?.value || '').trim();
          const hasMode = !!mode;
          const targetValue = String(targetInput?.value || '').trim();
          const needsTarget = mode === 'forward';
          const isValid = hasMode && (!needsTarget || !!targetValue);
          if (targetWrap) targetWrap.hidden = !hasMode;
          if (targetInput) targetInput.disabled = !hasMode;
          if (targetLabel) targetLabel.textContent = mode === 'self' ? 'ชื่อของคุณ' : 'ปลายทางการส่งต่อ';
          if (confirmBtn) {
            confirmBtn.disabled = !isValid;
            confirmBtn.setAttribute('aria-disabled', isValid ? 'false' : 'true');
            confirmBtn.title = !hasMode ? 'กรุณาเลือกการดำเนินการก่อนยืนยัน' : (needsTarget && !targetValue ? 'กรุณาระบุชื่อปลายทางก่อนยืนยัน' : '');
          }
          if (modeSelect) modeSelect.classList.toggle('invalid', !hasMode);
          if (targetInput) {
            targetInput.classList.toggle('invalid', needsTarget && !targetValue);
            if (mode === 'self') targetInput.value = fallbackSelfName;
          }
          if (validationNote) {
            validationNote.hidden = isValid;
            validationNote.textContent = !hasMode ? 'กรุณาเลือกการดำเนินการก่อนยืนยัน' : (needsTarget && !targetValue ? 'กรุณาระบุชื่อปลายทางก่อนยืนยัน' : '');
          }
          if (hasMode && isValid) {
            const resolvedTarget = mode === 'self' ? fallbackSelfName : targetValue;
            row = {
              ...row,
              assignedDev: resolvedTarget,
              routeMode: mode,
              routeTarget: resolvedTarget,
              routeTargetLabel: resolvedTarget,
              routeTargetEmployeeId: '',
              delegateOfficer: mode === 'forward' ? resolvedTarget : '',
              delegateOfficerId: '',
              delegateTeamId: '',
              delegateTeam: '',
              status: 'draft',
            };
            upsertRow(row);
          }
        };
        modeSelect?.addEventListener('change', syncFallbackState);
        targetInput?.addEventListener('input', syncFallbackState);
        if (String(row.routeMode || '').trim() === 'forward') modeSelect.value = 'forward';
        if (String(row.routeMode || '').trim() === 'self') modeSelect.value = 'self';
        syncFallbackState();
      }
    };
    const loadRelatedCriteriaBox = async () => {
      const box = document.getElementById('relatedCriteriaBox');
      if (!box) return;
      if (!isChangeRequestCase) {
        box.remove();
        return;
      }
      try {
        const [criteriaRes, subCriteriaRes] = await Promise.all([
          fetch('/api/hd-master?table=hd_criteria', { headers: authHeaders() }),
          fetch('/api/hd-master?table=hd_sub_criteria', { headers: authHeaders() }),
        ]);
        const criteriaData = await criteriaRes.json().catch(() => ({}));
        const subCriteriaData = await subCriteriaRes.json().catch(() => ({}));
        let ticketsData = { ok: true, data: [] };
        try {
          const ticketsRes = await fetch('/api/helpdesk/tickets', { headers: authHeaders() });
          ticketsData = await ticketsRes.json().catch(() => ({}));
          if (!ticketsRes.ok || !ticketsData.ok) ticketsData = { ok: true, data: [] };
        } catch {
          ticketsData = { ok: true, data: [] };
        }
        if (!criteriaData.ok || !subCriteriaData.ok) {
          throw new Error(criteriaData.error || subCriteriaData.error || 'โหลดข้อมูล Criteria ไม่สำเร็จ');
        }

        const criteriaRows = Array.isArray(criteriaData.data) ? criteriaData.data : [];
        const subCriteriaRows = Array.isArray(subCriteriaData.data) ? subCriteriaData.data : [];
        const ticketRows = Array.isArray(ticketsData.data) ? ticketsData.data : [];
        const parseExtra = (rowItem) => {
          try { return JSON.parse(rowItem?.extra || '{}') || {}; } catch { return {}; }
        };
        const changeRequestTerms = [
          'change request',
          'feature request',
          'enhancement',
          'ขอเพิ่ม',
          'ขอปรับ',
          'ปรับปรุง',
          'แก้ไข',
          'เพิ่ม',
          'request',
        ];
        const contextText = makeSearchText(
          analysis.problem_type,
          analysis.summary,
          analysis.likely_cause,
          row.title,
          row.description,
          row.issueTitle,
          row.contentText,
          row.projectName,
          row.subprojectName,
          ...(Array.isArray(analysis.keywords) ? analysis.keywords : []),
        );
        const isChangeRequest = normalizeText(analysis.problem_type).includes('change request') || includesAny(contextText, changeRequestTerms);
        const historicalTickets = ticketRows
          .map((ticket) => {
            const extra = parseExtra(ticket);
            const ticketText = makeSearchText(
              ticket.title,
              ticket.description,
              ticket.project,
              ticket.bug_type,
              extra.problem_cause_remark,
              extra.problem_solution_remark,
              extra.case_type_name,
              extra.issueTitle,
              extra.requester,
              extra.department,
              extra.parsed_content_text,
              ...(Array.isArray(extra.keywords) ? extra.keywords : []),
            );
            const type = normalizeHistoricalBugType(ticket.bug_type || extra.problem_type || extra.analysis?.problem_type || '');
            let score = 0;
            if (type === 'Change Request') score += 4;
            if (row.projectCode && String(ticket.project || '').toLowerCase().includes(String(row.projectCode).toLowerCase())) score += 2;
            if (includesAny(ticketText, changeRequestTerms)) score += 2;
            const overlapWords = contextText.split(/\s+/).filter((word) => word.length > 2).slice(0, 16);
            for (const word of overlapWords) {
              if (ticketText.includes(word)) score += 1;
            }
            return {
              row: ticket,
              extra,
              text: ticketText,
              type,
              score,
            };
          })
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score || String(b.row.updated_at || b.row.created_at || '').localeCompare(String(a.row.updated_at || a.row.created_at || '')));
        const topHistoricalTickets = historicalTickets.slice(0, 6);
        const subCriteriaByCriteria = new Map();
        for (const sub of subCriteriaRows) {
          const subExtra = parseExtra(sub);
          const linkedCriteriaId = String(subExtra.criteria_id || subExtra.criteriaId || subExtra.criteria || '').trim().toLowerCase();
          const linkedKey = linkedCriteriaId || String(sub?.criteria_id || '').trim().toLowerCase();
          if (!linkedKey) continue;
          const bucket = subCriteriaByCriteria.get(linkedKey) || [];
          bucket.push({ row: sub, extra: subExtra });
          subCriteriaByCriteria.set(linkedKey, bucket);
        }

        const scored = criteriaRows.map((criteriaRow) => {
          const criteriaExtra = parseExtra(criteriaRow);
          const criteriaText = makeSearchText(
            criteriaRow?.id,
            criteriaRow?.code,
            criteriaRow?.name,
            criteriaExtra.criteria_name,
            criteriaExtra.name,
            criteriaExtra.description,
          );
          const relatedSubs = [];
          const relatedSeen = new Set();
          for (const key of [
            criteriaRow?.id,
            criteriaRow?.code,
            criteriaRow?.name,
            criteriaExtra.criteria_id,
            criteriaExtra.criteria_code,
            criteriaExtra.criteria_name,
            criteriaExtra.source_id,
            criteriaExtra.external_id,
          ].map((value) => normalizeText(value)).filter(Boolean)) {
            const items = subCriteriaByCriteria.get(key) || [];
            for (const item of items) {
              const dedupeKey = normalizeText(item?.row?.id || item?.row?.code || item?.row?.name || item?.extra?.sub_criteria_name);
              if (!dedupeKey || relatedSeen.has(dedupeKey)) continue;
              relatedSeen.add(dedupeKey);
              relatedSubs.push(item.row);
            }
          }
          const subText = relatedSubs.map((sub) => makeSearchText(sub?.code, sub?.name, parseExtra(sub)?.sub_criteria_name)).join(' ');
          let score = 0;
          if (isChangeRequest) {
            const levelName = normalizeText([criteriaRow?.code, criteriaRow?.name, criteriaExtra.criteria_name].filter(Boolean).join(' '));
            if (levelName.includes('mandatory')) score += 8;
            else if (levelName.includes('high')) score += 7;
            else if (levelName.includes('medium')) score += 6;
            else if (levelName.includes('low')) score += 5;
            score += includesAny(criteriaText, changeRequestTerms) ? 6 : 0;
            score += includesAny(subText, changeRequestTerms) ? 4 : 0;
          }
          for (const ticket of topHistoricalTickets) {
            const ticketText = ticket.text || '';
            const ticketType = ticket.type || '';
            if (ticketType === 'Change Request') score += 1;
            if (includesAny(ticketText, changeRequestTerms)) score += 1;
            if (criteriaText && ticketText.includes(criteriaText)) score += 2;
            if (subText && ticketText.includes(subText)) score += 1;
            const ticketWords = ticketText.split(/\s+/).filter((word) => word.length > 2).slice(0, 12);
            for (const word of ticketWords) {
              if (criteriaText.includes(word)) score += 1;
              if (subText.includes(word)) score += 1;
            }
          }
          const matchedWords = contextText.split(/\s+/).filter((word) => word.length > 2);
          for (const word of matchedWords.slice(0, 18)) {
            if (criteriaText.includes(word)) score += 1;
            if (subText.includes(word)) score += 1;
          }
          if (normalizeText(criteriaRow?.code).includes('chg') || normalizeText(criteriaRow?.name).includes('change')) score += 2;
          if (normalizeText(criteriaExtra?.criteria_name).includes('change')) score += 1;

            extra: criteriaExtra,

                  extra: subExtra,
                  sequence: String(subExtra.sequence || sub?.sequence || '').trim(),
                  name: sub?.name || sub?.code || subExtra.sub_criteria_name || '',

              .sort((a, b) => {

                const bSeq = b.sequence || '9999';
                return String(aSeq).localeCompare(String(bSeq), 'en', { numeric: true });

          const sources = [];
          if (item?.extra) sources.push(item.extra);
          if (Array.isArray(item?.relatedSubs)) {
            for (const sub of item.relatedSubs) {

          }

          for (const source of sources) {
