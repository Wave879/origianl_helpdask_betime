user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name aidlc-bt.demotoday.net;
        absolute_redirect off;
        client_max_body_size 500m;

        location ^~ /assets/betime_solution/ {
            proxy_pass http://host.docker.internal:19120;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(shared\.js|config\.js)$ {
            proxy_pass http://host.docker.internal:19120;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /tor {
            return 301 /tor/;
        }

        location /tor/ {
            proxy_pass http://host.docker.internal:8096/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tor;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /api/ {
            proxy_pass http://host.docker.internal:8096/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tor;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /assets/ {
            proxy_pass http://host.docker.internal:8096/assets/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /web {
            return 301 /web/;
        }

        location = /sw.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 200 "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.registration.unregister(),caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))]).then(()=>self.clients.matchAll({type:'window'})).then(clients=>clients.forEach(client=>client.navigate(client.url)))));";
        }

        location = /service-worker.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 200 "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.registration.unregister(),caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))]).then(()=>self.clients.matchAll({type:'window'})).then(clients=>clients.forEach(client=>client.navigate(client.url)))));";
        }

        location = /web/sw.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 200 "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.registration.unregister(),caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))]).then(()=>self.clients.matchAll({type:'window'})).then(clients=>clients.forEach(client=>client.navigate(client.url)))));";
        }

        location = /web/service-worker.js {
            default_type application/javascript;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            return 200 "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(Promise.all([self.registration.unregister(),caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))))]).then(()=>self.clients.matchAll({type:'window'})).then(clients=>clients.forEach(client=>client.navigate(client.url)))));";
        }

        location ~ ^/web/(signin|forgot-password|apps|explore|activate-password|reset-password|email-code-login|install)(/.*)?$ {
            return 301 /dify/$1$2;
        }

        location ~ ^/web/web/(.*)$ {
            return 301 /web/$1;
        }

        location ~ ^/web/_next/(.*)$ {
            return 301 /dify/_next/$1;
        }

        location ~ ^/web/(manifest\.json|browserconfig\.xml|apple-touch-icon\.png|icon-192x192\.png|logo/.*)$ {
            return 301 /dify/$1;
        }

        location ~ ^/(.+)\.html$ {
            return 301 /web/$1;
        }

        location /web/ {
            proxy_pass http://host.docker.internal:19120;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /web;
            proxy_redirect ~^/(?!web/)(.*)$ /web/$1;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location = /web/dashboard/index.html {
            return 302 /web/dashboard;
        }

        location = /web/manager-dashboard/index.html {
            return 302 /web/manager-dashboard;
        }

        location = /web/staff-dashboard/index.html {
            return 302 /web/staff-dashboard;
        }

        location = /test {
            return 301 /test/;
        }

        location /test/ {
            proxy_pass http://host.docker.internal:9102;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /test;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location = /tool {
            return 301 /tool/;
        }

        location /tool/ {
            proxy_pass http://host.docker.internal:9102;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /tool;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location = /n8n {
            return 301 /n8n/;
        }

        location /n8n/ {
            proxy_pass http://host.docker.internal:5678/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /n8n;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types text/css text/javascript application/javascript;
            sub_filter 'href="/' 'href="/n8n/';
            sub_filter 'src="/' 'src="/n8n/';
            sub_filter 'data-src="/' 'data-src="/n8n/';
            sub_filter "window.BASE_PATH = '/';" "window.BASE_PATH = '/n8n/';";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location = /dify {
            return 301 /dify/;
        }

        location = /dify/signin {
            proxy_pass http://host.docker.internal:19120;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /dify;
            proxy_redirect http://aidlc-bt.demotoday.net/ https://aidlc-bt.demotoday.net/;
            add_header Clear-Site-Data "\"cache\", \"storage\", \"executionContexts\"" always;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location ^~ /dify/ {
            proxy_pass http://host.docker.internal:19120;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Prefix /dify;
            proxy_redirect http://aidlc-bt.demotoday.net/ https://aidlc-bt.demotoday.net/;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }

        location ~ ^/(signin|forgot-password|apps|explore|activate-password|reset-password|email-code-login|install)(/.*)?$ {
            return 301 /dify$request_uri;
        }

        location / {
            return 301 /web$request_uri;
        }
    }
}
