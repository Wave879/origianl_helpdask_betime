<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Secretary Dashboard — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-robot"></i> Smart Secretary Dashboard</h2></div>
    <div class="bt-kpi-grid">
      <div class="bt-card"><div class="bt-card-title">นัดหมายวันนี้</div><div class="bt-card-value" id="sec-today">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">นัดหมายสัปดาห์นี้</div><div class="bt-card-value" id="sec-week" style="color:var(--bt-primary)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">ประชุมเดือนนี้</div><div class="bt-card-value" id="sec-month" style="color:var(--bt-success)">—</div><div class="bt-card-sub">ครั้ง</div></div>
      <div class="bt-card"><div class="bt-card-title">การจองทรัพยากร</div><div class="bt-card-value" id="sec-bookings" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">รอดำเนินการ</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="bt-card">
        <div class="bt-section-header">
          <h2><i class="bi bi-calendar3"></i> นัดหมายวันนี้</h2>
          <a href="/calendar.html" class="bt-btn bt-btn-outline bt-btn-sm">ปฏิทิน</a>
        </div>
        <div id="sec-today-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
      <div class="bt-card">
        <div class="bt-section-header">
          <h2><i class="bi bi-calendar-week"></i> นัดหมายสัปดาห์นี้</h2>
        </div>
        <div id="sec-week-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px">
      <a href="/resource-booking.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <i class="bi bi-building" style="font-size:2rem"></i>
        <div style="font-weight:600;margin-top:8px">จองทรัพยากร</div>
      </a>
      <a href="/room-booking.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <i class="bi bi-door-open" style="font-size:2rem"></i>
        <div style="font-weight:600;margin-top:8px">จองห้องประชุม</div>
      </a>
      <a href="/vehicle-booking.html" class="bt-card" style="text-decoration:none;text-align:center;padding:24px;cursor:pointer">
        <i class="bi bi-car-front" style="font-size:2rem"></i>
        <div style="font-weight:600;margin-top:8px">จองยานพาหนะ</div>
      </a>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('secretary-dashboard.html', 'Smart Secretary');
  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const d = await BT.call('dashboard/secretary', {}, 'GET');
      document.getElementById('sec-today').textContent    = d.today_count ?? 0;
      document.getElementById('sec-week').textContent     = d.week_count ?? 0;
      document.getElementById('sec-month').textContent    = d.month_count ?? 0;
      document.getElementById('sec-bookings').textContent = d.pending_bookings ?? 0;

      const fmt = dt => dt ? dt.slice(11,16) : '';
      const todayRows = (d.today_events || []).map(e => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
          <div style="font-size:0.75rem;color:var(--bt-primary);font-weight:600;min-width:42px">${fmt(e.start_datetime)}</div>
          <div style="flex:1;font-size:0.85rem">${e.title}</div>
          ${e.location ? `<div style="font-size:0.75rem;color:#888"><i class="bi bi-geo-alt"></i>${e.location}</div>` : ''}
        </div>`).join('');
      document.getElementById('sec-today-list').innerHTML = todayRows || '<p style="color:#888;text-align:center;padding:20px">ไม่มีนัดหมายวันนี้</p>';

      const weekRows = (d.week_events || []).map(e => `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9">
          <div style="font-size:0.75rem;color:#888;min-width:70px">${(e.start_datetime||'').slice(0,10)}</div>
          <div style="flex:1;font-size:0.85rem">${e.title}</div>
        </div>`).join('');
      document.getElementById('sec-week-list').innerHTML = weekRows || '<p style="color:#888;text-align:center;padding:20px">ไม่มีนัดหมายสัปดาห์นี้</p>';
    } catch(e) {
      if (e.message === 'Unauthorized') { BT.handleUnauthorized(); return; }
    }
  });
</script>
</body>
</html>
