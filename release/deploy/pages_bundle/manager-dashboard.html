<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manager Dashboard — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-graph-up"></i> Manager Dashboard</h2></div>
    <div class="bt-kpi-grid">
      <div class="bt-card"><div class="bt-card-title">โครงการทีม</div><div class="bt-card-value" id="m-projects">—</div><div class="bt-card-sub">Active</div></div>
      <div class="bt-card"><div class="bt-card-title">งานเปิดอยู่</div><div class="bt-card-value" id="m-tasks" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">OT รออนุมัติ</div><div class="bt-card-value" id="m-ot" style="color:var(--bt-accent)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">สมาชิกทีม</div><div class="bt-card-value" id="m-members" style="color:var(--bt-success)">—</div><div class="bt-card-sub">คน</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="bt-card">
        <div class="bt-section-header"><h2>งานที่ค้างอยู่</h2></div>
        <div id="tasks-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
      <div class="bt-card">
        <div class="bt-section-header"><h2>OT รออนุมัติ</h2></div>
        <div id="ot-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('manager-dashboard.html', 'Team Overview');

  async function loadManager() {
    try {
      const d = await BT.call('dashboard/manager', {}, 'GET');
      document.getElementById('m-projects').textContent = (d.projects||[]).length;
      document.getElementById('m-tasks').textContent    = (d.tasks||[]).length;
      document.getElementById('m-ot').textContent       = (d.pending_ot||[]).length;
      document.getElementById('m-members').textContent  = (d.team_members||[]).length;

      const prioColor = { Critical:'red', High:'orange', Medium:'blue', Low:'grey' };
      const taskRows = (d.tasks||[]).map(t => `<tr>
        <td>${t.task_name}</td>
        <td><span class="bt-badge bt-badge-${prioColor[t.priority]||'grey'}">${t.priority||'-'}</span></td>
        <td style="font-size:0.82rem;color:#888">${t.assignee||'-'}</td>
        <td style="font-size:0.82rem;color:#888">${t.deadline||'-'}</td>
      </tr>`).join('');
      document.getElementById('tasks-list').innerHTML = taskRows
        ? `<table class="bt-table"><thead><tr><th>งาน</th><th>Priority</th><th>ผู้รับผิดชอบ</th><th>กำหนด</th></tr></thead><tbody>${taskRows}</tbody></table>`
        : '<p style="color:#888;text-align:center;padding:20px">ไม่มีงานค้าง</p>';

      const otRows = (d.pending_ot||[]).map(o => `<tr>
        <td>${o.full_name||o.employee}</td>
        <td>${o.ot_date}</td>
        <td>${o.ot_hours} ชม.</td>
        <td><span class="bt-badge bt-badge-orange">${o.status}</span></td>
      </tr>`).join('');
      document.getElementById('ot-list').innerHTML = otRows
        ? `<table class="bt-table"><thead><tr><th>พนักงาน</th><th>วันที่</th><th>OT</th><th>สถานะ</th></tr></thead><tbody>${otRows}</tbody></table>`
        : '<p style="color:#888;text-align:center;padding:20px">ไม่มี OT รออนุมัติ</p>';
    } catch(e) {
      if (e.message === 'Unauthorized') { BT.handleUnauthorized(); return; }
    }
  }

  document.addEventListener('DOMContentLoaded', loadManager);
</script>
</body>
</html>
