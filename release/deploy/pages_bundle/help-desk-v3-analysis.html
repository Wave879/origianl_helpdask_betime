            </div>
            ${isChangeRequestCase ? `
            <div class="v3a-box full v3a-criteria-box" id="relatedCriteriaBox">
              <div class="v3a-criteria-title">Criteria ที่เชื่อมกับ Change Request</div>
              <div class="v3a-criteria-loading">กำลังดึงข้อมูล Criteria...</div>
            </div>` : ''}
          </div>

            <div class="v3a-box">
              <div class="v3a-k">เนื้อหาที่แจ้ง</div>
              <div class="v3a-v">${esc(summary)}</div>
              <div class="v3a-v" style="margin-top:10px">${contentHtml}</div>
            </div>

          <div class="v3a-box">
            <div class="v3a-k">สาเหตุที่เป็นไปได้จาก Ai</div>
            ${possibleCausesHtml}
          </div>

          <div class="v3a-box full v3a-action-box" id="aiActionBox">
            <div class="v3a-action-title">แนวทางดำเนินการต่อ</div>
            <div class="v3a-action-loading">กำลังโหลดตัวเลือก...</div>
          </div>

        </div>
      </aside>

      <section class="v3a-right">
        <header class="v3a-chat-head">
          <div class="v3a-chat-person">
            <div class="v3a-chat-avatar-head">HA</div>
            <div class="v3a-chat-person-body">
              <div class="v3a-chat-name">MANA</div>
              <div class="v3a-ticket-sub">${esc(analysis.problem_type || 'Software')} • ${esc(row.projectCode || '-')} • ${esc(severity)}</div>
            </div>
          </div>
          <div class="v3a-chat-head-actions">
            <button class="v3a-chat-reset" type="button" id="resetChatBtn">รีเซตแชท</button>
          </div>
        </header>

        <div class="v3a-chat-body" id="chatMessages">
          <div class="v3a-thread">
            <div class="v3a-msg assistant">
              <div class="v3a-msg-meta">MANA</div>
              <div class="v3a-msg-body">
                <div class="v3a-bubble-title">${esc(initialMana.title)}</div>
              </div>
            </div>
            <div class="v3a-msg assistant">
              <div class="v3a-msg-meta">MANA</div>
              <div class="v3a-msg-body">
                <div class="v3a-bubble-question">${esc(initialMana.detail)}</div>
              </div>
            </div>
          </div>
        </div>

        <footer class="v3a-chat-footer">
          <div class="v3a-chat-attachment" id="chatImagePreview" hidden>
            <img id="chatImageThumb" alt="Image preview">
            <div class="v3a-chat-attachment-meta">
              <div class="v3a-chat-attachment-name" id="chatImageName"></div>
              <div class="v3a-chat-attachment-note">แนบรูปนี้ไปกับข้อความได้</div>
            </div>
            <button class="v3a-chat-attachment-clear" type="button" id="clearChatImageBtn">ลบ</button>
          </div>
          <div class="v3a-chat-prompts" aria-label="ข้อความแนะนำ">
            <button class="v3a-chat-prompt" type="button" data-chat-prompt="มีวิธีแก้ไขเบื้องต้นยังไงบ้าง" data-response-mode="fix_first">มีวิธีแก้ไขเบื้องต้นยังไงบ้าง</button>
            <button class="v3a-chat-prompt" type="button" data-chat-prompt="ต้องเอาข้อมูลตรงไหนเพิ่มอีก" data-response-mode="evidence_request">ต้องเอาข้อมูลตรงไหนเพิ่มอีก</button>
            <button class="v3a-chat-prompt" type="button" data-chat-prompt="ขั้นตอนถัดไปที่ควรทำคืออะไร" data-response-mode="next_step">ขั้นตอนถัดไปที่ควรทำคืออะไร</button>
          </div>
          <div class="v3a-composer">
            <button class="v3a-composer-attach" type="button" id="attachImageBtn" aria-label="แนบรูป" title="แนบรูป"><i class="bi bi-paperclip" aria-hidden="true"></i></button>
            <textarea class="v3a-composer-input" id="chatInput" placeholder="พิมพ์ข้อความ แล้วกด Enter เพื่อส่ง" rows="1"></textarea>
            <button class="v3a-composer-menu" type="button" id="sendChatBtn" aria-label="ส่งข้อความ" title="ส่งข้อความ"><i class="bi bi-send-fill" aria-hidden="true"></i></button>
          </div>
          <input id="chatImageInput" type="file" accept="image/*" hidden>
          <div class="v3a-footer-help">Enter เพื่อส่งข้อความ, Shift+Enter ขึ้นบรรทัดใหม่, แนบรูปได้จากปุ่มแนบรูป หรือวางรูปจาก clipboard</div>
        </footer>
      </section>

      <div class="v3a-ticket-modal" id="ticketHistoryModal" aria-hidden="true">
        <div class="v3a-ticket-modal-card" role="dialog" aria-modal="true" aria-labelledby="ticketHistoryModalTitle">
          <div class="v3a-ticket-modal-head">
            <div>
              <div class="v3a-ticket-modal-title" id="ticketHistoryModalTitle">Ticket/Kanban ที่เกี่ยวข้อง</div>
              <div class="v3a-ticket-sub">ใช้เป็น evidence ช่วยคัดแยกประเภทปัญหา ไม่ใช่การเลือกโครงการใหม่</div>
            </div>
            <button class="v3a-ticket-modal-close" type="button" id="closeTicketHistoryPopup">ปิด</button>
          </div>
          <div class="v3a-ticket-modal-body">
            <div class="v3a-v" style="white-space:pre-wrap;line-height:1.55"><span id="ticketHistoryBox">${esc(ticketHistory)}</span></div>
          </div>
        </div>
      </div>
    `;

    const getActiveFollowUpQuestion = () => {
      const followUpBubble = document.querySelector('#agentFollowUpBubble .v3a-bubble-question');
      const initialBubble = document.querySelector('#chatMessages .v3a-thread > .v3a-msg:nth-child(2) .v3a-bubble-question');
      return String(followUpBubble?.textContent || initialBubble?.textContent || '').trim();
    };

    root.querySelectorAll('[data-analysis-tab]').forEach((button) => {
      button.addEventListener('click', () => {
        activeMobileAnalysisTab = button.dataset.analysisTab === 'chat' ? 'chat' : 'details';
        root.dataset.activeTab = activeMobileAnalysisTab;
        root.querySelectorAll('[data-analysis-tab]').forEach((tab) => {
          tab.setAttribute('aria-selected', String(tab === button));
        });
      });
    });

    document.getElementById('sendChatBtn')?.addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      if (!input) return;
      if (String(input.value || '').trim() || chatImageAttachment) {
        sendChatMessage();
        return;
      }
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    });
    document.getElementById('attachImageBtn')?.addEventListener('click', () => {
      document.getElementById('chatImageInput')?.click();
    });
    document.getElementById('chatImageInput')?.addEventListener('change', (event) => {
      const file = event.target?.files?.[0];
      if (file) setChatImageAttachment(file);
    });
    document.getElementById('clearChatImageBtn')?.addEventListener('click', clearChatImageAttachment);
    document.getElementById('resetChatBtn')?.addEventListener('click', resetHelpdeskChatSession);
    document.getElementById('chatInput')?.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;
      if (event.shiftKey) return;
      event.preventDefault();
      sendChatMessage();
    });
    document.getElementById('chatInput')?.addEventListener('input', (event) => {
      resizeChatComposerInput(event.target);
    });
    document.getElementById('chatInput')?.addEventListener('paste', (event) => {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItem = items.find((item) => item.kind === 'file' && item.type.startsWith('image/'));
      const file = imageItem?.getAsFile?.();
      if (!file) return;
      event.preventDefault();
      setChatImageAttachment(file);
    });
    document.querySelectorAll('[data-chat-prompt]').forEach((button) => {
      button.addEventListener('click', () => {
        sendSuggestedChatPrompt(button.getAttribute('data-chat-prompt'), button.getAttribute('data-response-mode'));
      });
    });
    const goConfirmTicket = async () => {
      const modeSelect = document.getElementById('routeModeSelect');
      const targetSelect = document.getElementById('routeTargetSelect');
      const validationNote = document.getElementById('routeValidationNote');
      const mode = String(modeSelect?.value || '').trim();
      const targetValue = String(targetSelect?.value || '').trim();
      let validationMessage = '';
      if (!mode) {
        validationMessage = 'กรุณาเลือกการดำเนินการก่อนยืนยัน';
      } else if (mode === 'forward' && !targetValue) {
        validationMessage = 'กรุณาเลือก Dev ปลายทางก่อนยืนยัน';
      }
      if (validationMessage) {
        if (modeSelect) modeSelect.classList.toggle('invalid', !mode);
        if (targetSelect) targetSelect.classList.toggle('invalid', mode === 'forward' && !targetValue);
        if (validationNote) {
          validationNote.hidden = false;
          validationNote.textContent = validationMessage;
        }
        BT.notify(validationMessage, 'warning');
        return;
      }
      const nextRow = {
        ...row,
        status: 'draft',
      };
      cancelQueuedRemoteSave();
      upsertRow(nextRow, { persistRemote: false });
      try {
        const saved = await saveTicketRemote(nextRow);
        upsertRow(saved);
        row = saved;
      } catch (err) {
        console.warn('helpdesk confirm stage save failed', err);
      }
      saveConfirmSnapshot(row || nextRow);
      BT.go(`/help-desk-v3-confirm?id=${encodeURIComponent((row && row.id) || nextRow.id)}`);
    };
    const applyChatStatus = (nextStatus) => {
      const targetStatus = String(nextStatus || '').trim();
      if (!targetStatus) return;
      const nextRow = {
        ...row,
        status: targetStatus,
      };
      if (targetStatus === 'open') {
        nextRow.assignedDev = row.assignedDev || '';
      }
      upsertRow(nextRow);
      row = nextRow;
      BT.notify(targetStatus === 'closed' ? 'ยืนยันและปิดเคสแล้ว' : 'ยกเลิกการดำเนินการแล้ว', targetStatus === 'closed' ? 'success' : 'info');
    };
    const cancelAnalysis = () => {
      applyChatStatus('open');
      BT.go('/help-desk-v3.html');
    };
    document.getElementById('chatConfirmBtn')?.addEventListener('click', goConfirmTicket);
    document.getElementById('chatCancelBtn')?.addEventListener('click', cancelAnalysis);
    document.querySelectorAll('[data-suggest]').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById('chatInput');
        const value = String(button.getAttribute('data-suggest') || '').trim();
        if (!input || !value) return;
        input.value = value;
        resizeChatComposerInput(input);
        input.focus();
      });
    });
    resizeChatComposerInput();
    const ticketHistoryModal = document.getElementById('ticketHistoryModal');
    const openTicketHistoryModal = () => {
      if (!ticketHistoryModal) return;
      ticketHistoryModal.classList.add('open');
      ticketHistoryModal.setAttribute('aria-hidden', 'false');
    };
    const closeTicketHistoryModal = () => {
      if (!ticketHistoryModal) return;
      ticketHistoryModal.classList.remove('open');
      ticketHistoryModal.setAttribute('aria-hidden', 'true');
    };
    document.getElementById('ticketMatchSummaryBox')?.addEventListener('click', openTicketHistoryModal);
    document.getElementById('ticketMatchSummaryBox')?.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      openTicketHistoryModal();
    });
    document.getElementById('closeTicketHistoryPopup')?.addEventListener('click', closeTicketHistoryModal);
    ticketHistoryModal?.addEventListener('click', (event) => {
      if (event.target === ticketHistoryModal) closeTicketHistoryModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeTicketHistoryModal();
    }, { once: true });
    const persistChangeRequestControls = () => {
      const priority = normalizePriorityLevel(document.getElementById('changePrioritySelect')?.value || analysis.priority_level || '');
      const impact = normalizePriorityLevel(document.getElementById('changeImpactSelect')?.value || analysis.impact || '');
      const urgency = normalizePriorityLevel(document.getElementById('changeUrgencySelect')?.value || analysis.urgency || '');
      if (!priority && !impact && !urgency) return;
      const priorityDetail = [
        priority ? `Priority: ${formatPriorityLevel(priority)}` : '',
        impact ? `Impact: ${formatPriorityLevel(impact)}` : '',
        urgency ? `Urgency: ${formatPriorityLevel(urgency)}` : '',
        analysis.criteria ? `Criteria: ${analysis.criteria}` : '',
        analysis.sub_criteria ? `Sub Criteria: ${analysis.sub_criteria}` : '',
      ].filter(Boolean).join(' • ');
      analysis.priority_level = priority || analysis.priority_level || 'medium';
      analysis.impact = impact || analysis.impact || '';
      analysis.urgency = urgency || analysis.urgency || '';
      analysis.priority_detail = priorityDetail || analysis.priority_detail || '';
      analysis.priority_source = 'user-review';
      row = {
        ...row,
        analysis: { ...analysis },
      };
      upsertRow(row);
      const meta = document.getElementById('changeRequestPriorityMeta');
      if (meta) meta.textContent = analysis.priority_detail || 'User สามารถปรับระดับเพื่อกัน AI เลือกผิดได้';
    };
    ['changePrioritySelect', 'changeImpactSelect', 'changeUrgencySelect'].forEach((id) => {
      document.getElementById(id)?.addEventListener('change', persistChangeRequestControls);
    });
    document.getElementById('analysisProblemTypeSelect')?.addEventListener('change', (event) => {
      const nextType = normalizeProblemType(event.target.value);
      analysis.problem_type = nextType;
      if (nextType !== 'Change Request') {
        analysis.priority_level = '';
        analysis.priority_name = '';
        analysis.priority_detail = '';
        analysis.priority_source = '';
      }
      row = {
        ...row,
        bug_type: nextType,
        analysis: {
          ...analysis,
          problem_type: nextType,
          priority_level: analysis.priority_level || '',
          priority_name: analysis.priority_name || '',
          priority_detail: analysis.priority_detail || '',
          priority_source: analysis.priority_source || '',
        },
      };
      upsertRow(row);
      render();
    });
    requestAnimationFrame(() => revealChatThread());
    requestAnimationFrame(() => loadRelatedSlaBox());
    requestAnimationFrame(() => loadActionRoutingBox());
    requestAnimationFrame(() => loadRelatedCriteriaBox());
    requestAnimationFrame(() => loadSimilarTicketHistory());
    requestAnimationFrame(() => loadPersistedTicketChat());
  }

  function showAnalysisFallback(message) {
    const root = document.getElementById('analysisRoot');
    if (!root) return;
    root.innerHTML = `
      <div class="v3a-empty">
        ${esc(message || 'ไม่สามารถโหลดผลวิเคราะห์ได้')}
        <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="bt-btn bt-btn-outline" type="button" onclick="BT.go('/help-desk-v3-create.html')">กลับไปสร้าง Ticket</button>
          <button class="bt-btn bt-btn-primary" type="button" onclick="window.location.reload()">ลองโหลดใหม่</button>
        </div>
      </div>`;
  }

  async function resolveInitialAnalysisRow(id = '', tmp = '') {
    const normalizedId = String(id || '').trim();
    const normalizedTmp = String(tmp || '').trim();
    if (normalizedId) {
      const remoteMatch = await fetchTicketRemote(normalizedId);
      if (remoteMatch) return remoteMatch;
    }
    const localRows = loadRows();
    if (normalizedId) {
      const localMatch = localRows.find((item) => String(item.id) === normalizedId);
      if (localMatch) return localMatch;
    }
    if (normalizedTmp) {
      try {
        const pending = JSON.parse(sessionStorage.getItem(`bt_helpdesk_v3_pending::${normalizedTmp}`) || 'null');
        if (pending) return pending;
      } catch {}
    }
    try {
      const res = await fetch('/api/helpdesk/tickets', { headers: authHeaders() });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok && Array.isArray(data.data) && data.data.length) {
        if (normalizedId) {
          const exact = data.data.find((item) => String(item.id || '') === normalizedId || String(item.odoo_ticket_id || '') === normalizedId);
          if (exact) return exact;
        }
        return data.data[0];
      }
    } catch {}
    return localRows[0] || null;
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const params = new URLSearchParams(location.search);
      const id = String(params.get('id') || '').trim();
      const tmp = String(params.get('tmp') || '').trim();
      row = await resolveInitialAnalysisRow(id, tmp);
      render();
      window.setTimeout(() => {
        const root = document.getElementById('analysisRoot');
        if (root && root.textContent.includes('กำลังโหลดผลวิเคราะห์')) {
          showAnalysisFallback(id || tmp ? 'โหลดข้อมูลผลวิเคราะห์ไม่สำเร็จ' : 'ยังไม่พบ Ticket สำหรับเปิดหน้าวิเคราะห์');
        }
      }, 1200);
    } catch (err) {
      console.error('analysis render failed', err);
      showAnalysisFallback(err?.message || 'โหลดข้อมูลผลวิเคราะห์ไม่สำเร็จ');
    }
  });
</script>
</body>
</html>
