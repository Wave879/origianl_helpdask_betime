<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal KPIs — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-bullseye"></i> Personal KPIs</h2></div>
    <div class="bt-kpi-grid">
      <div class="bt-card"><div class="bt-card-title">งานรอทำ</div><div class="bt-card-value" id="k-pending">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">งานเสร็จแล้ว</div><div class="bt-card-value" id="k-done" style="color:var(--bt-success)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">งานเกินกำหนด</div><div class="bt-card-value" id="k-over" style="color:var(--bt-danger)">—</div><div class="bt-card-sub">รายการ</div></div>
      <div class="bt-card"><div class="bt-card-title">OT เดือนนี้</div><div class="bt-card-value" id="k-ot" style="color:var(--bt-warning)">—</div><div class="bt-card-sub">ชั่วโมง</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      <div class="bt-card">
        <div class="bt-section-header"><h2>งานของฉัน</h2></div>
        <div id="my-tasks-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
      <div class="bt-card">
        <div class="bt-section-header"><h2>โครงการที่เกี่ยวข้อง</h2></div>
        <div id="my-projects-list"><p style="color:#888;text-align:center;padding:30px">กำลังโหลด...</p></div>
      </div>
    </div>
  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('my-kpis.html', 'My Performance');

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      const d = await BT.call('kpis', {}, 'GET');
      document.getElementById('k-pending').textContent = d.tasks_total  ?? 0;
      document.getElementById('k-done').textContent    = d.tasks_done   ?? 0;
      document.getElementById('k-over').textContent    = d.tasks_overdue ?? 0;
      document.getElementById('k-ot').textContent      = d.ot_hours     ?? 0;

      const prioColor = { Critical:'red', High:'orange', Medium:'blue', Low:'grey' };
      const taskRows = (d.my_tasks||[]).map(t => `<tr>
        <td>${t.task_name}</td>
        <td><span class="bt-badge bt-badge-${prioColor[t.priority]||'grey'}">${t.priority||'-'}</span></td>
        <td style="color:${t.deadline && t.deadline < new Date().toISOString().slice(0,10) ? 'var(--bt-danger)' : '#888'};font-size:0.82rem">${t.deadline||'-'}</td>
      </tr>`).join('');
      document.getElementById('my-tasks-list').innerHTML = taskRows
        ? `<table class="bt-table"><thead><tr><th>งาน</th><th>Priority</th><th>กำหนด</th></tr></thead><tbody>${taskRows}</tbody></table>`
        : '<p style="color:#888;text-align:center;padding:20px">ไม่มีงานค้าง 🎉</p>';

      const projRows = (d.my_projects||[]).map(p => `
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:0.85rem;font-weight:600">${p.project_name}</span>
            <span style="font-size:0.75rem;color:#888">${p.progress||0}%</span>
          </div>
          <div style="background:#e5e7eb;border-radius:99px;height:6px">
            <div style="width:${p.progress||0}%;background:var(--bt-primary);height:6px;border-radius:99px"></div>
          </div>
        </div>`).join('');
      document.getElementById('my-projects-list').innerHTML = projRows || '<p style="color:#888;text-align:center;padding:20px">ไม่มีโครงการ</p>';
    } catch(e) {
      if (e.message === 'Unauthorized') { BT.handleUnauthorized(); return; }
    }
  });
</script>
</body>
</html>
