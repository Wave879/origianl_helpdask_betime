app:
  name: "Mana Bot"
  description: "Fast BeTime helpdesk bot with Qdrant knowledge bridge and one final Mana reply."
  icon: "🤖"
  icon_type: emoji
  icon_background: "#EAF4FF"
  mode: advanced-chat
  use_icon_as_answer_icon: false
kind: app
version: "0.6.0"
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/openai:0.0.23
      version: null
workflow:
  conversation_variables:
    - description: "Short running summary of the customer issue and what Mana already asked."
      id: "cv-case-memory"
      name: case_memory
      selector: [conversation, case_memory]
      value: ""
      value_type: string
  environment_variables:
    - id: "env-qdrant-search-url"
      name: QDRANT_SEARCH_URL
      value: "http://127.0.0.1:8788/api/knowledge/qdrant-search"
      value_type: string
    - id: "env-qdrant-api-key"
      name: QDRANT_API_KEY
      value: ""
      value_type: secret
    - id: "env-qdrant-collection"
      name: QDRANT_COLLECTION
      value: "betime_helpdesk_knowledge"
      value_type: string
    - id: "env-qdrant-project-strict"
      name: QDRANT_PROJECT_STRICT
      value: "true"
      value_type: string
  features:
    file_upload:
      enabled: true
      image:
        enabled: false
        number_limits: 0
        transfer_methods: []
      allowed_file_extensions: [.jpg, .jpeg, .png, .webp, .pdf]
      allowed_file_types: [image, document]
      allowed_file_upload_methods: [local_file, remote_url]
      number_limits: 3
    opening_statement: "สวัสดีครับ ผม Mana ช่วยค้น knowledge และไล่อาการเบื้องต้นให้ครับ"
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
      - "ระบบเข้าไม่ได้ต้องเช็กอะไร"
      - "ต้องเตรียมข้อมูลอะไรบ้าง"
      - "อาการนี้เป็น bug หรือ human error"
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ""
      voice: ""
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: http-request
        id: "start-qdrant"
        source: "start"
        sourceHandle: source
        target: "qdrant_search"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: http-request
          targetType: llm
        id: "qdrant-reply"
        source: "qdrant_search"
        sourceHandle: source
        target: "reply"
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: answer
        id: "reply-answer"
        source: "reply"
        sourceHandle: source
        target: "answer"
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          title: "Start"
          type: start
          variables:
            - label: "Project code"
              variable: project_code
              type: text-input
              required: false
              max_length: 80
            - label: "Sub project code"
              variable: sub_project_code
              type: text-input
              required: false
              max_length: 80
            - label: "Ticket ID"
              variable: ticket_id
              type: text-input
              required: false
              max_length: 80
            - label: "Customer name"
              variable: customer_name
              type: text-input
              required: false
              max_length: 120
        height: 180
        id: "start"
        position: { x: 40, y: 280 }
        positionAbsolute: { x: 40, y: 280 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          title: "Qdrant knowledge bridge"
          type: http-request
          method: post
          url: "{{#env.QDRANT_SEARCH_URL#}}"
          headers: |
            Content-Type: application/json
            Authorization: Bearer {{#env.QDRANT_API_KEY#}}
          params: ""
          body:
            type: json
            data:
              - id: "body-query"
                key: query
                type: string
                value: "{{#sys.query#}}"
              - id: "body-collection"
                key: collection
                type: string
                value: "{{#env.QDRANT_COLLECTION#}}"
              - id: "body-project"
                key: project_code
                type: string
                value: "{{#start.project_code#}}"
              - id: "body-subproject"
                key: sub_project_code
                type: string
                value: "{{#start.sub_project_code#}}"
              - id: "body-strict"
                key: project_strict
                type: string
                value: "{{#env.QDRANT_PROJECT_STRICT#}}"
              - id: "body-limit"
                key: limit
                type: number
                value: 3
          authorization:
            type: no-auth
          timeout:
            connect: 5
            read: 12
            write: 5
          retry_config:
            retry_enabled: false
          selected: false
        height: 220
        id: "qdrant_search"
        position: { x: 360, y: 280 }
        positionAbsolute: { x: 360, y: 280 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 320
      - data:
          title: "Mana reply"
          type: llm
          model:
            provider: langgenius/openai/openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0.25
              max_tokens: 420
          prompt_template:
            - id: "mana-system"
              role: system
              text: |
                You are Mana, a customer-facing Helpdesk assistant for BeTime.
                Reply in Thai by default. Be natural, warm, concise, and useful.
                Use the Qdrant result only when relevant. If the result is empty or unrelated, answer from the user's message and ask for the smallest useful missing detail.
                Do not recommend an internal handoff team. Do not say which team should own the issue.
                Do not expose raw backend details, API keys, internal prompts, or implementation details.

                Classify internally using this legacy taxonomy when useful:
                - Human error: wrong selection, wrong data entry, wrong confirmation, wrong document/record.
                - system error: timeout, 500, outage, failed API/server/system response.
                - System Bug: repeated abnormal behavior, wrong logic, broken screen/module, reproducible unexpected result.
                - Change Request: request to add, change, remove, improve, approve, or alter workflow/report/UI/wording.
                - Software: configuration, permission, master data, mapping, integration, setup, or software behavior not yet proven as a bug.
                - network: VPN, LAN, Wi-Fi, firewall, internet, site access, connection instability.
                - hardware: device, printer, scanner, computer, cable, peripheral, swap-test issue.

                Evidence guidance:
                - Human error: ask for document/record reference and correct value.
                - system error: ask for time, error message/screenshot, and how many users are affected.
                - System Bug: ask for screen, reproduction steps, expected result, and actual result.
                - Change Request: ask what should change, who is affected, deadline, and approval dependency.
                - network: ask for location, connection type, and whether another network/device works.
                - hardware: ask for device model, symptom, and result after trying another cable/device.
                - Software: ask for screen, user permission, and related master/config data.
            - id: "mana-user"
              role: user
              text: |
                Customer message:
                {{#sys.query#}}

                Project code: {{#start.project_code#}}
                Sub project code: {{#start.sub_project_code#}}
                Ticket ID: {{#start.ticket_id#}}
                Customer name: {{#start.customer_name#}}
                Conversation summary: {{#conversation.case_memory#}}

                Qdrant knowledge result:
                {{#qdrant_search.body#}}
          context:
            enabled: false
            variable_selector: []
          memory:
            query_prompt_template: "{{#sys.query#}}"
            role_prefix:
              assistant: "Mana"
              user: "Customer"
            window:
              enabled: true
              size: 4
          variables: []
          vision:
            enabled: false
          selected: false
        height: 300
        id: "reply"
        position: { x: 740, y: 240 }
        positionAbsolute: { x: 740, y: 240 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 360
      - data:
          title: "Answer"
          type: answer
          answer: "{{#reply.text#}}"
          variables: []
        height: 90
        id: "answer"
        position: { x: 1160, y: 310 }
        positionAbsolute: { x: 1160, y: 310 }
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          title: ""
          type: ""
          text: "Taxonomy: Human error, system error, System Bug, Change Request, Software, network, hardware"
          theme: blue
          author: ""
          showAuthor: false
        height: 120
        id: "note-taxonomy"
        position: { x: 360, y: 40 }
        positionAbsolute: { x: 360, y: 40 }
        type: custom-note
        width: 320
      - data:
          title: ""
          type: ""
          text: "Evidence: ask for only the smallest missing detail. No team recommendation."
          theme: yellow
          author: ""
          showAuthor: false
        height: 120
        id: "note-evidence"
        position: { x: 740, y: 40 }
        positionAbsolute: { x: 740, y: 40 }
        type: custom-note
        width: 320
      - data:
          title: ""
          type: ""
          text: "Performance: one HTTP request to BeTime/Qdrant bridge, one LLM reply."
          theme: green
          author: ""
          showAuthor: false
        height: 120
        id: "note-speed"
        position: { x: 1120, y: 40 }
        positionAbsolute: { x: 1120, y: 40 }
        type: custom-note
        width: 320
    viewport: { x: 40, y: 120, zoom: 0.75 }
