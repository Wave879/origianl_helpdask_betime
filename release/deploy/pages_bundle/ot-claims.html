<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OT Claims — Betime Solution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/betime_solution/css/betime.css">
</head>
<body class="betime-portal bt-shell-body">
<div id="bt-appbar-holder"></div>
<div class="bt-layout" id="bt-layout-holder">
  <main class="bt-main-content">
    <div class="bt-page-header"><h2><i class="bi bi-clock"></i> OT Claims</h2></div>
    <div class="bt-card" style="margin-bottom:20px">
      <h4>ยื่นคำขอ OT ใหม่</h4>
      <form id="ot-form">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <div class="bt-form-group"><label class="bt-label">วันที่ OT *</label><input type="date" id="ot-date" class="bt-input" required></div>
          <div class="bt-form-group"><label class="bt-label">ชั่วโมง OT *</label><input type="number" id="ot-hours" class="bt-input" min="0.5" step="0.5" required></div>
          <div class="bt-form-group"><label class="bt-label">อัตรา OT (บาท/ชม.)</label><input type="number" id="ot-rate" class="bt-input" value="150"></div>
          <div class="bt-form-group" style="grid-column:1/-1"><label class="bt-label">เหตุผล *</label><textarea id="ot-reason" class="bt-input" rows="2" required></textarea></div>
        </div>
        <div style="display:flex;align-items:center;gap:16px">
          <button type="submit" class="bt-btn bt-btn-primary"><i class="bi bi-send"></i> ส่งคำขอ OT</button>
          <span style="color:#888;font-size:0.9rem">ยอดรวม: <strong id="ot-total">0</strong> บาท</span>
        </div>
      </form>
    </div>
    <div class="bt-card">
      <div class="bt-section-header"><h2>รายการ OT ของฉัน</h2></div>
      <div id="ot-list"><p style="color:#888;text-align:center;padding:20px">กำลังโหลด...</p></div>
    </div>  </main>
</div>
<script src="/config.js"></script>
<script src="/shared.js"></script>
<script src="/assets/betime_solution/js/betime.js"></script>
<script>
  BT.initApp('ot-claims.html', 'Overtime Management');
      document.getElementById('ot-hours').addEventListener('input',()=>{const h=parseFloat(document.getElementById('ot-hours').value)||0;const r=parseFloat(document.getElementById('ot-rate').value)||150;document.getElementById('ot-total').textContent=(h*r).toLocaleString();});
    document.getElementById('ot-form').addEventListener('submit', async e=>{
      e.preventDefault();
      if (!BT.hasBackend()) { BT.notify('ตั้งค่า Backend ก่อน', 'warning'); return; }
      try {
        await BT.call('betime_solution.api.portal.submit_ot_claim', {ot_date:document.getElementById('ot-date').value,ot_hours:document.getElementById('ot-hours').value,ot_rate:document.getElementById('ot-rate').value,reason:document.getElementById('ot-reason').value});
        BT.notify('✅ ส่งคำขอ OT สำเร็จ', 'success'); e.target.reset(); loadOtList();
      } catch(e2) { BT.notify(e2.message, 'error'); }
    });
    async function loadOtList() {
      if (!BT.hasBackend()) return;
      try {
        const rows = await BT.listDocs('OT Claim', ['name','ot_date','ot_hours','amount','status'], {}, 20);
        const tbody = rows.map(r=>`<tr><td>${r.ot_date||'-'}</td><td>${r.ot_hours}</td><td>${(r.amount||0).toLocaleString()}</td><td><span class="bt-badge bt-badge-${r.status==='Approved'?'success':r.status==='Rejected'?'danger':'warning'}">${r.status||'Draft'}</span></td></tr>`).join('');
        document.getElementById('ot-list').innerHTML = `<table class="bt-table"><thead><tr><th>วันที่</th><th>ชม.</th><th>จำนวน (฿)</th><th>สถานะ</th></tr></thead><tbody>${tbody||'<tr><td colspan=4 style=text-align:center;color:#888>ไม่มีข้อมูล</td></tr>'}</tbody></table>`;
      } catch(e) {}
    }
    document.addEventListener('DOMContentLoaded', loadOtList);
</script>
</body>
</html>
